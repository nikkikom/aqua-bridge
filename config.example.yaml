# Copy to config.yaml on the Pi. Channel names are logical, not the controller's pwmN.
#
# Legacy mode (no mpc.topology): one implicit zone, one setpoint tracked by PI or
# a small linear MPC. The names below (coolant, air, radiator, intake) are
# placeholders from an earlier watercooling draft; this file stays as it is
# because legacy mode must behave bit for bit as before (PROJECT.md, header).
# The target plant is the zoned DAS enclosure: start from config.example-das.yaml.

mqtt:
  enabled: false         # MQTT Discovery for Home Assistant (section 7); LWT on {node_id}/status
  host: mqtt.local
  port: 1883
  username: ""
  password: ""
  discovery_prefix: homeassistant
  node_id: aqua-bridge
  allow_calibrate: false # accept {node_id}/cmd/calibrate/<bay> (DAS mode only; a raw number,
                         # degC). OFF by default -- MQTT has only the broker's ACL and a
                         # calibration is a measurement, not policy (section 7). Needs username:

host:
  interval_s: 5          # refresh, s (MQTT host sensors, /api/state's "host" key)

mpc:
  solver: pi             # "pi" (first cut) or "mpc" (small linear MPC, numpy)
  dt: 2.0                # seconds per tick
  horizon: 8             # MPC prediction horizon, ticks (>= 1); ignored by "pi"
  temps:                 # plant temperatures the gate checks; setpoints keys must be listed here
    - coolant
    - air
  setpoints:             # target °C per controlled temperature; every key must be in temps
    coolant: 35.0
  channel_temps:         # fan channel -> temperatures it controls (each must have a setpoint).
    radiator: [coolant]  # Omit or leave {} to let every channel control every setpoint temp.
    intake: [coolant]    # Error per channel = max over its temps of (T - setpoint).
  weights:               # MPC tracking weight per temperature; missing temp -> 1.0
    coolant: 1.0
  weight_pwm: 0.0        # MPC penalty on PWM effort, per PWM^2 (>= 0); > 0 trades a steady-state offset
  weight_dpwm: 60.0      # MPC penalty on PWM moves, per PWM^2 per tick (>= 0; "mpc" needs one of the two > 0)
  mpc_tau_s: 120.0       # MPC model: time constant of the controlled temperatures, seconds (> 0)
  mpc_gain_c_per_pwm: 8.0  # MPC model: steady-state °C drop of a temperature per +1.0 PWM on one of its channels
  mpc_estimator_gain: 0.1  # MPC offset-free disturbance estimator, per-tick gain in (0, 1]
  budget_ms: 250.0        # runtime alarm: log a warning when step() takes longer than this, ms (> 0);
                          # re-derived on the Zero 2 W (item 73): 2.9x the measured DAS MPC step
                          # p99 of 85.96 ms -- the legacy MPC here is far cheaper (p99 7.14 ms at
                          # dt = 2 s measured on the same board).
  budget_alarm_ms: 350.0  # runtime alarm: log an error instead past this, ms (> budget_ms; raising
                          # budget_ms means changing this value too, or the config does not load).
                          # The Zero W fallback of §8 item 73 -- budget_ms 1000.0 with
                          # budget_alarm_ms 1250.0 and mpc_every_ticks 3 -- is for the DAS MPC and
                          # is spelled out on the live keys of config.example-das.yaml.
  budget_log_interval_s: 60.0  # rate limit for both budget log lines, seconds (> 0)
  pi_kp: 0.05            # PI proportional gain, PWM per °C of error (> 0)
  pi_ki: 0.002           # PI integral gain, PWM per (°C * s) (>= 0)
  pwm_min: 0.15
  pwm_max: 1.0
  d_pwm_max: 0.1         # max |Δpwm| per tick, also honoured while ramping to fallback
  fallback_pwm:          # HIGH cooling on fault; keys exactly channels, each in (pwm_min, pwm_max]
    radiator: 0.8
    intake: 0.8
  fallback_hold_s: 10    # hold last good command this long, then ramp toward fallback_pwm
  confirm_s: 6           # consecutive trusted seconds before auto; >= 2*dt and <= fallback_hold_s
  dT_max_c_per_s: 2.0    # gate slew limit, °C/s; per-tick limit = this * dt
  temp_min_c: -20.0      # gate absolute valid range, °C
  temp_max_c: 120.0
  median3: false         # pre-filter: median of last 3 raw samples per temperature
  stuck_s: 180           # window, seconds; several plant time constants, not a debounce
  stuck_eps_c: 0.02      # "unchanged" band; aquaero reports 0.01 °C
  stuck_pwm_net: 0.15    # net PWM move over the window that must show up in T
  stuck_sibling_dT_c: 1.0
  stuck_airflow_net: 0.15  # DAS only (inert here): zone relative-airflow move that is Stuck evidence, (0, 1]
  stuck_air_oppose_c: 0.3  # DAS only (inert here): zone-air move against it that voids it for a proximal sensor, degC
  stuck_air_oppose_max_c: 3.0  # DAS only (inert here): an opposing move above this no longer voids it, degC (> stuck_air_oppose_c)
  stuck_zone_air_dT_c: 1.5  # DAS only (inert here): zone-air move that is evidence when another proximal reading of the zone followed it, degC
  stuck_pwm_lag_fraction: 0.25  # fraction of the Stuck window a PWM/airflow move must be old before it counts, [0, 0.5]
  solver_max_iter: 50    # MPC iteration cap; hitting it is a solver fault (fallback)
  channels:
    - radiator
    - intake
  # Zoned DAS layout (plan "zoned DAS thermal control"). All absent/empty = legacy
  # mode: one implicit zone with every channel and temperature, exactly the
  # behaviour described above. topology switches DAS mode on and then needs
  # sensors (keys exactly temps), fans (keys exactly channels) and fan_models;
  # the other DAS sections are rejected without topology.
  # A full DAS example (4 zones, 15 bays, 8 outputs) is config.example-das.yaml.
  topology: null         # {zones: {<z>: {channels, coupled_to, inlet}}, bays: {<b>: {zone, class, occupied, serial, limit_c}}, default_class}
  sensors: {}            # <temp>: {role: inlet|zone_air|drive_proximal|exhaust, zone, bay, quant_c, stuck_s, stuck_eps_c, stuck_decimate, redundant, tau_s}
  drive_classes: {}      # <class>: {limit_c, comfort_c, tau_d_s, models}; empty = hdd 50/5, ssd_sata 65/10, nvme 70/10
  fans: {}               # <channel>: {model, count, group, noise_weight, forbidden_pwm: [[lo, hi]]}
  fan_models: {}         # <model>: {rpm_max, deadband, exponent, noise_db_at_max}
  zones: null            # {trust_rule: strict|sigma, fault_coupling: declared|none, sigma_floor_hold_s: 1800, sigma_floor_growth_c: 1.0, sigma_floor_release_per_min: 0.0025}
  noise: null            # {exponent: 5, weight_noise: 1.0, band_hysteresis: 0.02}
  estimator: null        # drive estimator: {k_sigma: 2.0, sigma_fault_c, sigma_air_fault_c, q_t_air, q_d_air, q_t_drive, q_t_sensor, q_heat, q_offset, sensor_noise_c, proximal_offset_c, proximal_slope_spread, proximal_gap_sigmas, air_blind_fault_s, smart_max_age_s, smart_reject_c, occupied_dT_c, empty_dT_c, empty_confirm_s, occupancy_hold_s, bay_settle_s, bay_settle_max_s, bay_uncertain_var_c2, bay_cal_step_c, calibration_max_age_days, manual_calibration_max_age_days, calibrate_min_c, calibrate_max_c, associate_window_s, associate_min_corr, associate_margin, associate_drop_corr, associate_drop_checks, sigma_uncalibrated_c, p0_t_air, p0_d_air, p0_t_drive, p0_t_sensor, p0_heat, reset_drive_var, jump_min_c, jump_sigmas}
  # DAS thermal model identification (control/thermal.py); inert in legacy mode.
  model_shadow: false    # true (needs topology): learn and predict the zoned thermal model without acting
  model_window_s: 120.0  # sin^2-weighted regression window, (0, 600]; >= 2 * dt with model_shadow
  model_lambda: 0.9995   # RLS forgetting per excited window, (0.99, 1]
  model_p_trace_max: 100.0     # covariance trace bound (scaled units), > 0
  model_converged_rel_se: 0.25 # relative standard error of every fan gain for "converged", (0, 1)
  model_converged_bays_frac: 1.0  # DAS only (inert here): the fraction of a zone's occupied bays
                         # that must have informed themselves for the zone to converge, (0, 1].
                         # 1.0 is all-or-nothing; the zone's air block must pass whatever this is
  model_partial_k_sigmas: 1.0  # DAS only (inert here): with the fraction below 1.0, a bay its zone
                         # converged without is planned at k - this many standard errors (>= 0),
                         # its own lower confidence bound -- the safe side (fans higher)
  model_max_pred_err_c: 1.0    # one-window prediction error allowed for "converged", degC, > 0
  model_use_rpm: false   # true (needs topology): airflow from the tachometer where one reports
  model_reset_on_swap: true  # DAS only (inert here): a hot-swapped bay's identified g0, k, q_s
                             # start over from the prior (they described the drive that left)
  model_freeze: false    # true (needs topology): a zone that converges -- or is converged when
                         # the switch goes on -- is entered frozen and stops adapting; a model
                         # the data contradicts still goes suspect and relearns
  model_split_channels: false  # true (needs topology): a fan group carries a per-channel split
                         # coefficient the single-channel experiment phases identify
  fan_curve_online: false      # true (needs topology): fit each fan model's PWM -> RPM curve online
                         # (deadband/exponent, read by the thermal model, the MPC's prediction,
                         # the estimator's airflow and the noise objective's u0; the fan_health
                         # rules, the Stuck airflow evidence and every rpm_max stay on fan_models)
  fan_curve_settle_s: 30.0     # a duty must hold this long before its (pwm, rpm) pair is sampled (>= 0)
  fan_curve_refit_s: 600.0     # shortest interval between two fits per fan model, seconds (> 0)
  fan_curve_max_rmse_frac: 0.05  # relative RMSE above which a fit is refused, (0, 1]
  fan_curve_max_age_s: 3600.0  # a fit nothing re-confirms for this long goes stale and its readers
                         # fall back to the curve in force before it (the model store's, else the
                         # configured one). Re-confirmed by an accepted refit and by any tachometer
                         # reading, not only a settled sample (>= fan_curve_refit_s)
  # DAS MPC (control/solver_das.py: solver "mpc" with topology and no setpoints); inert in legacy mode.
  mpc_pred_dt_s: 30.0    # prediction step, seconds (> 0; >= dt with topology); horizon counts these steps
  mpc_blocks: []         # move blocks summing to horizon; [] = [1, 1, 2, 4, 6, 6] cut to horizon
  mpc_every_ticks: 1     # solve every n-th tick, replay the plan in between (>= 1; inert without
                         # topology. The DAS MPC's Zero W fallback is 3, see config.example-das.yaml)
  rho_soft: 40.0         # penalty per degC^2 above a drive's soft target (> 0)
  rho_hard: 4000.0       # penalty per degC^2 above its hard target (>= rho_soft)
  solver_outer_max: 4    # active-piece iterations per solve (>= 1)
  model_max_drift_c_per_min: 0.5  # validity gate: drift the drives' own rate does not explain, degC/min (> 0)
  model_return_factor: 0.5  # back from the model fallback: gate limits scaled by this (0, 1]
  model_return_dwell_s: 300.0  # ... held continuously this long, seconds (>= 0)
  model_drift_rate_tau_s: 120.0  # low-pass both the drives' observed rate and the model's go through, s (> 0)
  model_drift_dwell_s: 120.0  # a drift or air-disturbance check must fail this long to fault the model (>= 0);
                              # leaky: one passing tick does not restart it, a passing spell this long does
  model_max_air_dist_c_per_min: 8.0  # validity gate: the zone-air disturbance's move away from its slow level (> 0)
  model_air_dist_tau_s: 900.0  # ... that slow level's time constant, seconds (> 0), and how long it must
                               # have run before the check has a reference (it reports null until then)
  model_accept_prior: false  # true (needs topology): the MPC may act on a model that has not converged
  # DAS model store ($STATE_DIRECTORY/model.json or --model-store PATH); inert in legacy mode.
  model_store_interval_s: 600.0   # at most one write of model.json per interval, seconds (> 0)
  model_store_max_age_days: 30.0  # an older file loads stale: shadow first, PI-DAS acts (> 0)
  model_reconfirm_s: 3600.0       # a stale model acts after converged this long with its prediction error in bounds (>= 0)
  # Active identification experiments (control/ident.py, POST /api/ident); inert in legacy mode.
  ident_enabled: false   # true (needs topology): an explicit start intent may run an experiment
  ident_amplitude: 0.15  # PWM step of the two-level sequence, (0, 0.3]
  ident_levels: above    # above: base and base + amplitude | symmetric: base +- amplitude
  ident_amplitude_mode: fixed  # fixed: every channel spends ident_amplitude | headroom: the
                         # smallest step that reaches ident_pe_aim * sqrt(PE_MIN) from where the
                         # channel is parked, cut into [pwm_min, pwm_max] and never further
                         # than ident_amplitude from the base either way. Worth it under
                         # ident_levels: symmetric, where the step is cooling given up.
                         # band:<ch> then refuses a start whose remaining swing cannot
                         # reach the model's PE bound at all
  ident_pe_aim: 2.0      # multiple of sqrt(PE_MIN) a headroom-sized telegraph aims for, > 0;
                         # below about 1.5 no zone converges (measured)
  ident_replan: true     # levels follow the live solver demand every tick (false: frozen at the start)
  ident_parallel: false  # true: one experiment excites every channel of the target's own zones at
                         # once, each on its own code -- what the thermal model needs to converge.
                         # Louder while it runs; with ident_levels: symmetric the whole zone, not
                         # one group of it, may sit ident_amplitude under the solver's command
  ident_require_excitable: false  # true: refuse a start (not_excitable:<ch>) whose channel cannot reach
                         # the thermal model's PE bound from where the solver parked it, at this
                         # ident_amplitude. The reach it reads is an upper bound: with a hold
                         # shorter than model_window_s a regression window averages the two levels
  ident_hold_s: [60, 120, 180]  # hold times the seeded sequence draws from (each >= 5 * dt when enabled)
  ident_max_duration_s: 1800    # whole experiment, seconds, (0, 7200]
  ident_settle_s: 600    # every zone served trusted this long before a start (>= confirm_s when enabled)
  ident_start_band_c: 1.0  # start only with every drive within this of its soft target, degC
  ident_max_over_c: 3.0  # envelope above each drive's soft target while running, degC
  ident_abort_below_limit_c: 1.0  # absolute abort: estimate + k sigma this far below the limit
  ident_settle_resume_max_gap_s: 300.0  # longest outage after which model.json's settle timers count
  ident_seed: 1          # seed of the hold-time sequence (int >= 0)

# --source xt6 (the default): one Aqua Computer controller over hidraw, found under
# /sys/class/hidraw by USB id (tools/aquacomputer_probe.py lists what is attached).
xt6:
  device: aquaero        # aquaero | quadro
  # serial: "12345-54321"  # only needed when several of one kind are attached
  fans:                  # one entry per mpc.channels name: output pwmN and optional tachometer fanN of that output
    radiator: {pwm: pwm1, rpm: fan1}   # aquaero pwm1-4 its own outputs, pwm5-8 a Quadro on its aquabus; Quadro pwm1-4
    intake:   {pwm: pwm2, rpm: fan2}
  temp_map:              # logical temperature -> input: temp1-8 physical sensors, bus1-8 aquabus slots,
    coolant: temp1       # virt1-4 virtual sensors (Quadro: temp1-4). A softN software sensor is NOT
    air: temp2           # bindable: it holds what a host wrote, then its configured fallback for ever,
                         # which reads exactly like a measurement (PROJECT.md section 8 item 113). The
                         # slots are published in device_health.devices[].software_sensors
                         # instead. Upgrading: a temp_map that binds one must be repointed
                         # first -- the daemon now refuses to start (exit 2). A bus1-8 is a
                         # reading only while a device answers on aquabus (section 8 item 92);
                         # on the aquaero that presence is judged from the aquabus fan blocks
                         # or the aquabus flow slot (section 8 item 130), so no other key here
                         # needs to change for a bus1-8 to be bound
  # Timing, defaults shown (PROJECT.md section 3, Track B). Writes take effect at once and
  # are not saved in the controller's memory; a power cycle brings back its saved configuration.
  status_max_age_s: 3.0         # an older status report is no observation: fallback (> 0)
  ctrl_gap_ms: 100              # wait after a control operation before the next read or write, ms (>= 0; default aquaero 100, quadro 0)
  ctrl_retries: 1               # retries of a failed control operation, each from a fresh read (int 0..5)
  ctrl_budget_s: 5.0            # no control operation starts after this much of one write (> 0)
  ctrl_refresh_s: 60.0          # read the control report again this often (>= 0, 0 disables)
  duty_mismatch_tolerance: 100  # output duty this far from the written duty is a mismatch, 1/100 % (0..10000)
  duty_mismatch_s: 5.0          # a mismatch lasting longer re-reads and rewrites every channel (> 0)
  write_min_interval_s: 0.0     # a falling duty is written at most this often (>= 0; 0 writes every change; rises go out at once)
  write_deadband: 0             # a falling duty is written only this far below the written one, 1/100 % (0..10000; 0 writes every change)
  bus_absent_s: 10.0            # every aquabus fan block must read "no device" (rpm 0xFFFF) for this long
                                # before the daemon reports the device on the aquaero's aquabus as lost
                                # (> 0; what it buys is the blip, a device re-enumerating for a report
                                # or two; a skipped aquabus poll never looks like a departure at any
                                # window, since presence is read from the speed field every report carries).
                                # It bounds the report only: an aquabus temperature slot (busN) reads as
                                # missing from the first such report, because such a slot keeps the last
                                # value it read instead of reading 0x7FFF (section 8 item 92)
  heartbeat_sensor: 0           # software sensor softN (aquaero 1..8) the daemon writes on every tick
                                # that commanded the duties, as a hardware watchdog; 0 is off (the
                                # controller's own timeout, fallback temperature and alarm action are
                                # set on the device itself). Set it to the sensor you enabled there:
                                # while a sensor is enabled on the device with a timeout and an alarm
                                # and nothing writes it, it falls back and the alarm selects its
                                # profile about one timeout after boot -- the watchdog has fired for
                                # good and cannot fire again. 0 is right only while no software sensor
                                # is enabled on the controller.
  heartbeat_value_c: 20.0       # the temperature the heartbeat writes, degC: below the sensor's alarm

# Fan-health drift monitoring (PROJECT.md section 3 "Fan and device health", section 8
# item 79). Every status report carries each output's rpm, output duty, 12 V rail
# voltage, current and power; they are recorded and published either way, and these
# keys decide when a deviation is reported. Defaults shown. The rpm and power rules
# need mpc.fans / mpc.fan_models, which a legacy config like this one leaves empty, so
# in this config only the rail rule is live; tools/fit_fans.py fits the curve the rpm
# rule compares against, and fan_models.<m>.power_w_at_max (no default: measure it) is
# what the power rule judges against. That rule still cannot run on either supported
# controller: the aquaero measures no current on its own outputs, and a bus device's
# outputs sample it inside the PWM cycle, so most reports read 0 mA with the fan turning
# (PROJECT.md section 2, 2026-09-18). The keys are kept for a controller that reports a
# judgeable current; until then the published verdict names power as a rule that did
# not run.
fan_health:
  enabled: true              # false: the readings are still recorded and published, no rule runs
  min_duty: 0.25             # below this output duty no rpm or power rule fires (0..1)
  settle_s: 15.0             # the rpm and power rules judge a reading against the band the duty
                             # spanned over this long, and judge nothing until that much has
                             # accumulated (>= 0): an aquabus fan's rpm in the aquaero's report
                             # lags several seconds, so a step must not read as drift
  rpm_tolerance_frac: 0.25   # a speed this fraction of rpm_max outside the band is a deviation
  rpm_fault_s: 120.0         # an rpm deviation held this long is reported, seconds (> 0)
  rail_min_v: 11.0           # 12 V rail window, volts; a block reading 0.0 V is not judged
  rail_max_v: 13.0           # (that is an empty aquabus slot, not a dead rail); max > min
  rail_fault_s: 30.0         # a rail excursion held this long is reported, seconds (> 0); the
                             # rail rule needs no duty, so it is judged while the duty moves too
  power_tolerance_frac: 0.5  # measured power this fraction outside the band is a deviation
  power_exponent: 3.0        # expected power = power_w_at_max * phi(duty) ** this (fan law, > 0)
  power_min_w: 0.2           # expected power below this is not judged, watts (>= 0)
  power_fault_s: 120.0       # a power deviation held this long is reported, seconds (> 0)
  log_interval_s: 300.0      # one log line per channel at most this often, seconds (> 0)

# The Raspberry Pi's own temperature and throttling as a health signal (PROJECT.md
# section 3 "Fan and device health", section 8 item 103 and the owner decision of
# 2026-09-16 in section 8.1). The board is NOT part of the thermal model: about a watt
# against the drives' tens of watts, and its reading is dominated by its own
# self-heating. It is never a solver input, never a zone air sensor, never a model node
# -- these rules only produce a published field and a log line. Defaults shown.
host_health:
  enabled: true              # false: the board's temperature and throttling are still
                             # read, published and shown; no rule runs
  temp_limit_c: 75.0         # the board above this is a deviation, degC: the Pi caps its
                             # ARM clock around 80 and hard-throttles around 85, so this
                             # warns before the board starts defending itself
  temp_fault_s: 120.0        # held this long it is reported, seconds (> 0): a build or an
                             # update heats the SoC for tens of seconds; two minutes is
                             # placement or airflow
  divergence_c: 40.0         # the board further than this from the enclosure air is a
                             # deviation while the CPU is idle, degC (> 0). A coarse
                             # backstop: an un-heatsinked Zero 2 W idles 20-25 degC above
                             # the air around it (the owner's reads 47.2 degC at idle), so
                             # a healthy board is already that far from a room-temperature
                             # reference. Narrow it only from a measured board-vs-air
                             # delta. Judged on the absolute difference, either way round
  divergence_fault_s: 900.0  # a divergence held this long, idle throughout, is reported,
                             # seconds (> 0); the enclosure's air moves in minutes
  idle_load1_max: 0.5        # the CPU counts as idle at or below this load1 (>= 0): above
                             # it the board's reading says more about the CPU than the air,
                             # so the divergence rule is not evidence of anything
  air_temps: []              # the temperatures averaged as the enclosure-air reference;
                             # empty means every zone_air sensor, else every inlet sensor,
                             # else every configured temperature
  log_interval_s: 300.0      # one log line for the board at most this often, seconds (> 0)
  vcgencmd_interval_s: 60.0  # how often a reader may run `vcgencmd get_throttled`,
                             # seconds (> 0). On a Raspberry Pi Zero 2 W with kernel
                             # 6.18 the firmware exposes no get_throttled sysfs
                             # attribute, so that process is the only source of the
                             # whole word and the control tick uses it too; one fork
                             # costs 3.3 ms there (3.8 ms p95), so once a minute is
                             # 0.07 % of the one 5 s tick it lands on and 0.5 % of
                             # mpc.budget_ms. The last word is served in between,
                             # tagged with its age. Lower it to notice throttling
                             # sooner, at one 3.3 ms fork per interval
  vcgencmd_timeout_s: 2.0    # how long one `vcgencmd get_throttled` may take, seconds
                             # (> 0); it guards against a VideoCore mailbox that never
                             # answers. A timeout is simply unknown, and the chain
                             # falls through to the rpi_volt hwmon under-voltage bit
  disk_path: "/"             # the filesystem the disk-free and read-only rules judge.
                             # Point this at record_path's mount when it is not "/" --
                             # record_path and --model-store are not pinned to "/",
                             # so these rules judge the wrong card if it moves and
                             # this key does not move with it
  disk_free_min_gb: 2.0      # free space on disk_path below this many GB is a
                             # deviation (>= 0). Argued from what actually writes to
                             # the default disk_path: the recorder's own worst case
                             # is 20 MB x 6 files = 120 MB at its defaults, the model
                             # store's measured floor is 1.4 KB -- under 125 MB
                             # together, unconditionally. deploy/install-board-watchdogs.sh
                             # also caps the journal at JOURNAL_MAX_USE (200 MB), but
                             # only when the image keeps a persistent journal; 2 GB
                             # leaves room to act well beyond either figure
  disk_free_fault_s: 60.0    # a free-space deviation held this long is reported,
                             # seconds (> 0); a short debounce against one noisy
                             # statvfs sample, not a filter for anything transient --
                             # a filling card is a slow, roughly monotonic trend, and
                             # this rule is a hint (like the divergence rule): it can
                             # sit true for days, and must not latch device_problem

# The spin-up kick: a fan that is commanded but does not turn (PROJECT.md section 3
# "Spin-up kick", section 8 item 75). A fan's STARTING duty is higher than its running
# duty -- the owner's aquaero test fan stops at 13 % and starts at 25 % -- so a channel
# can read a healthy duty on a healthy rail while the rotor stands still and the
# enclosure is silently uncooled there. Defaults shown.
#
# THIS SECTION HAS NO EFFECT ON THIS CONFIG. The rule needs the channel's fitted curve
# (mpc.fans / mpc.fan_models, which need mpc.topology) to say what speed an output
# should reach, so without a zoned config every channel reports the rule as off, with
# that as the reason, and no command ever changes. See config.example-das.yaml for the
# per-output kick duties measured on the owner's hardware.
spin_up:
  enabled: true              # false: nothing is detected, nothing is kicked, and every
                             # channel's verdict says the rule is off
  stall_duty: 0.15           # a channel commanded below this output duty may
                             # legitimately stand still and is not judged (0..1); above
                             # the 13 % at which the owner's test fan stops. Per output:
                             # channels.<ch>.stall_duty
  kick_duty: 0.5             # the duty a kick raises a channel to (0..1) when that
                             # channel has no kick_duty of its own: twice the 25 % start
                             # duty measured on the owner's aquaero output, the margin an
                             # uncharacterised output gets. Clamped into
                             # [mpc.pwm_min, mpc.pwm_max] when it is applied
  kick_s: 30.0               # how long one kick holds the channel there, seconds (> 0).
                             # It has to cover the mpc.d_pwm_max ramp up to that duty as
                             # well as the rotor's own start time, and a value below that
                             # ramp plus one tick is a config error: the fan would be
                             # kicked to a duty it never reaches and then declared failed
                             # for a kick it never got. Here: 0.15 -> 0.5 at d_pwm_max
                             # 0.1 is 4 ticks = 8 s of ramp, so at least 10 s
  confirm_s: 30.0            # a channel must read at or below min_rpm under a duty at or
                             # above its stall duty for this long of live, uninterrupted
                             # readings before it is kicked, seconds (> 0). It is also
                             # what covers the seconds a healthy fan needs to spin up
  verify_s: 30.0             # after a kick, how long the tachometer is watched before
                             # the next attempt, seconds (> 0)
  max_attempts: 3            # kicks one channel gets before it is a failed fan (>= 1)
  min_rpm: 60.0              # a speed at or below this is "not turning", rpm (>= 0). Not
                             # zero: a tachometer reading a handful of rpm is a rotor
                             # that is not moving air either
  retry_s: 900.0             # a failed channel gets one more sequence after this long,
                             # seconds (> 0), so a fan replaced while the daemon runs is
                             # picked up without a restart -- and a dead one costs at most
                             # max_attempts kicks per this interval instead of for ever
  clear_s: 30.0              # a declared failure is retracted only once the tachometer
                             # has read above min_rpm for this long of live,
                             # uninterrupted readings (> 0). Declaring one costs
                             # confirm_s and every attempt, so retracting it -- the alarm
                             # and the floor below -- may not cost one reading: a dead
                             # rotor windmilled by its siblings' air reads a few rpm
  failed_channel_floor: true # while a fan is declared failed, hold every other channel
                             # of the zones it served at the duty it carried when the
                             # failure was declared, so the zone cannot lose cooling
                             # because one of its fans died. The rise above that floor
                             # comes from the measured temperatures through the solver.
                             # A sibling whose own fan is already declared dead is never
                             # floored: it moves no air at any duty
  failed_channel_floor_max: 0.6
                             # no such hold is ever recorded above this duty (0..1): a
                             # failure declared in the middle of a hot spell would
                             # otherwise pin the enclosure there for as long as the fan
                             # stays dead. Above the cap the temperatures hold the
                             # siblings up on their own, through the solver
  log_interval_s: 300.0      # one log line per channel and transition at most this
                             # often, seconds (> 0)
  channels: {}               # per output: what is on it and what it needs --
                             #   <ch>: {fan: true, tachometer: true,
                             #          stall_duty: null, kick_duty: null}
                             # fan: false  -> nothing hangs on this output
                             # tachometer: false -> this fan drives no tach wire
                             # Either one turns the rule off for that output: it is never
                             # kicked and never alarmed, and the verdict says which. A
                             # null stall_duty / kick_duty means the section's value

http:
  # HTTPS with basic auth only; there is no plain-HTTP listener (PROJECT.md section 6).
  # With enabled: true but a missing or invalid certificate, key or credentials
  # file the API stays off (logged) and the daemon keeps controlling the fans.
  enabled: false
  bind: 0.0.0.0
  port: 8443
  # PEM certificate and key; deploy/install-pi.sh creates a self-signed pair if absent.
  # The key must be mode 0640 root:<service user>.
  tls_cert: /etc/aqua-bridge/tls/cert.pem
  tls_key: /etc/aqua-bridge/tls/key.pem
  # One user:pbkdf2_sha256$... line per user, mode 0640 root:<service user>;
  # create users with tools/http_user.py. Reread when it changes.
  credentials_file: /etc/aqua-bridge/http-users
  realm: aqua-bridge
  # PBKDF2-HMAC-SHA256 iterations for newly written hashes (tools/http_user.py);
  # each uncached check costs this many iterations of CPU on the Pi.
  hash_iterations: 100000
  # Seconds a verified user:password is cached (the page polls every 2 s); 0 = no cache.
  auth_cache_s: 300
  # After auth_fail_limit consecutive failed logins a client gets 429 for
  # auth_backoff_s, doubling per further failure up to auth_backoff_max_s; 0 = off.
  auth_fail_limit: 5
  auth_backoff_s: 1
  auth_backoff_max_s: 300
  # Global limit on uncached password checks (one PBKDF2 each, about 1.2 s of the
  # Zero W's single core at 100000 iterations), across every client address: at most
  # auth_verify_max start per auth_verify_window_s (0 = no window limit) and at most
  # auth_verify_pending_max are admitted and unfinished at once; beyond either a
  # request that needs a check gets 429. A cached login is never limited.
  auth_verify_max: 6
  auth_verify_window_s: 60
  auth_verify_pending_max: 2
  # Added to the nice value of the thread that runs the checks (Linux, 0-19; 0 = same
  # priority as the control loop).
  auth_verify_nice: 10

digole:
  device: /dev/serial0
  baud: 9600
  enabled: false

# DS18B20 on 1-Wire is a DAS feature: this legacy single-controller config has no
# sensors on it, so nothing is read and the rest of the section defaults
# (resolution_bits 12, read_tier auto, netlink_timeout_s 1.0, netlink_retry_s
# 300.0, tier_failures_before_demote 3, bulk_read auto, bulk_timeout_s 2.0,
# bulk_retry_s 300.0, poll_interval_s 0.02, slow_cycle_log_interval_s 60.0,
# max_age_s 1.5 * mpc.dt).
# config.example-das.yaml has the section filled in and
# documents every key; PROJECT.md section 3 has the schema.
onewire:
  enabled: false
  sensors: []
