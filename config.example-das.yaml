# Zoned DAS example (PROJECT.md): 4 zones, 15 hot-swap bays, 8 PWM outputs
# (aquaero 6 XT xt1-xt4 + Quadro qd1-qd4 on the aquaero's aquabus, commanded
# through the aquaero's outputs 5-8; 1-2 fans per output, one tach per output),
# 25 sensors (8 thermistors on the aquaero inputs, 17 DS18B20 on 1-Wire; the
# Quadro's inputs are not bound: how many are usable is known only once it is
# connected). Copy to /etc/aqua-bridge/config.yaml on the Pi and
# replace the names, controller inputs and ROM ids with your own.
#
# Run it with --source composite (aquacomputer: + onewire: below; the systemd unit needs
# a drop-in for that -- deploy/install-pi.sh --das installs one, PROJECT.md
# section 10) or, without hardware, with
# --source sim --sim-plant das (the DAS truth simulator built from the topology
# below; an optional top-level "sim: {das: {preset: basic|rich, seed: 0}}"
# section tunes it). --record PATH (or a top-level record_path, with
# record_max_bytes / record_backup_count) records every tick for
# tools/fit_model.py, tools/fit_fans.py and tools/replay.py.
#
# DAS mode: mpc.topology present and mpc.setpoints empty. Each sensor is gated
# on its own; a zone is trusted while every required sensor group (its zone
# air, the proximal sensors of each occupied or unknown bay) has a trusted
# member. A zone in fault holds, then ramps high, every output that moves air
# through it or through a zone coupled to it (mode "degraded"; "fallback" when
# every zone is in fault); the other outputs keep regulating. A fault never
# reduces cooling.
#
# Solvers: "pi" regulates the drives' margins (PI-like DAS form): per output,
# the worst drive of the zones it serves decides. "mpc" is the DAS MPC: least
# modelled fan noise with every drive under its targets, acting only on a
# model that passes its validity gate, else regulating exactly like "pi".
# Drive temperatures are estimated from the proximal and zone-air sensors
# (per-zone Kalman filter, margin k_sigma * sigma); the limits come from
# drive_classes. Runtime changes go through POST /api/limit {bay|class,
# limit_c} (MQTT {node_id}/cmd/limit/<bay> and {node_id}/cmd/limit/class/<class>);
# a runtime limit can only be at or below the one written here. POST /api/bay
# declares a bay's occupancy, class or serial. Presets: quiet = comfort band
# -2 degC and noise weight x2, cool = comfort band +2 degC and noise weight x0.5.

mqtt:
  enabled: false
  host: mqtt.local
  port: 1883
  username: ""
  password: ""
  discovery_prefix: homeassistant
  node_id: aqua-bridge

host:
  interval_s: 5          # refresh, s (MQTT host sensors, /api/state's "host" key)

mpc:
  solver: pi             # pi: PI-like DAS solver (margin deficit per output); mpc: DAS MPC
  dt: 5.0                # seconds per tick; drive time constants are minutes
  horizon: 20            # DAS MPC prediction steps of mpc_pred_dt_s (10 minutes)
  temps:                 # every sensor the gate checks; keys of sensors below
    - inlet_a
    - inlet_b
    - air_z0
    - air_z1
    - air_z2
    - air_z3
    - prox_b01
    - prox_b02
    - prox_b03
    - prox_b03b
    - prox_b04
    - prox_b05
    - prox_b06
    - prox_b07
    - prox_b08
    - prox_b09
    - prox_b10
    - prox_b10b
    - prox_b11
    - prox_b12
    - prox_b13
    - prox_b14
    - prox_b15
    - exhaust_z0
    - exhaust_z2
  setpoints: {}          # not used in DAS mode: drives are regulated to their class limits
  channel_temps: {}      # must stay empty with topology
  weights: {}
  weight_pwm: 0.0
  weight_dpwm: 1.0       # DAS MPC: penalty per PWM^2 between move blocks (damps the plan)
  mpc_tau_s: 120.0       # legacy MPC model only
  mpc_gain_c_per_pwm: 8.0
  mpc_estimator_gain: 0.1
  # Step budget (§8.1 owner decisions 2026-09-14, §8 item 73). If the DAS MPC misses
  # budget_ms on the Zero W after the item 73 optimisations, the owner's fallback is to
  # change all three values together: budget_ms and budget_alarm_ms here, mpc_every_ticks
  # further down. Each comment below names the value to write. Edit the value in place --
  # a second copy of a key in this mapping is not an override, it is the only one YAML
  # keeps (the last), so a repeated key would drop what is written here; since item 73 the
  # loader refuses a repeated key instead of picking one.
  budget_ms: 600.0        # runtime alarm + CI/Pi bench gate: warn past this step() time, ms (> 0);
                          # measured DAS MPC p99 609-615 ms on the Zero W (item 73, to be re-measured).
                          # item 73 fallback: 1000.0 -- budget_ms must stay strictly below
                          # budget_alarm_ms, so raise that one with it
  budget_alarm_ms: 750.0  # error instead past this, ms (> budget_ms).
                          # item 73 fallback: 1250.0 (the same 1.25 ratio, still a quarter of dt)
  budget_log_interval_s: 60.0  # rate limit for both budget log lines, seconds (> 0)
  pi_kp: 0.02            # PWM per degC of margin deficit (> 0)
  pi_ki: 0.0001          # PWM per (degC * s); integral time pi_kp / pi_ki = 200 s
  pwm_min: 0.2
  pwm_max: 1.0
  d_pwm_max: 0.1         # max |delta pwm| per tick
  fallback_pwm:          # HIGH cooling on a zone fault; keys exactly channels
    xt1: 0.8
    xt2: 0.8
    xt3: 0.8
    xt4: 0.8
    qd1: 0.8
    qd2: 0.8
    qd3: 0.8
    qd4: 0.8
  fallback_hold_s: 30    # hold the last command this long in a zone fault, then ramp high
  confirm_s: 15          # consecutive trusted seconds before a zone returns; >= 2*dt, <= hold
  dT_max_c_per_s: 1.0    # gate slew limit, degC/s
  temp_min_c: -20.0
  temp_max_c: 120.0
  median3: false
  stuck_s: 600           # legacy global Stuck window; DAS sensors use the per-role values
  stuck_eps_c: 0.1
  stuck_pwm_net: 0.15    # legacy per-channel PWM evidence; DAS sensors use stuck_airflow_net
  stuck_sibling_dT_c: 1.0  # a sibling's plausible net move (same zone and role; proximal: same bay)
  # DAS Stuck evidence (PROJECT.md section 3, "Stuck sizing"): a sensor frozen in its band
  # is flagged when its zone's relative airflow (sum of count-weighted fan curves, block
  # means over the window) moved by more than stuck_airflow_net, (0, 1]; for a proximal
  # sensor not when every zone-air sensor moved against that move (warmer after more
  # airflow, cooler after less) by more than stuck_air_oppose_c, degC (> 0), and at most
  # stuck_air_oppose_max_c, degC (> stuck_air_oppose_c): an airflow move shifts the
  # drive-to-air difference by a few degC at most, so a larger air swing cannot excuse a
  # reading that did not move. With no airflow evidence (the airflow inside
  # stuck_airflow_net -- fans pinned at pwm_max, a slow trim -- or an excused move) a
  # zone-air move above stuck_zone_air_dT_c, degC (> 0), is the evidence instead, but only
  # while another proximal reading of the same zone moved with it by more than
  # stuck_sibling_dT_c: at constant airflow the drive-to-air difference moves only with the
  # bay's own power, so that much air movement had to reach a healthy proximal reading,
  # while a zone-air sensor that is merely drifting moves alone and must flag nobody.
  stuck_airflow_net: 0.15
  stuck_air_oppose_c: 0.3
  stuck_air_oppose_max_c: 3.0
  stuck_zone_air_dT_c: 1.5
  # Fraction of the Stuck window a PWM (legacy) or airflow (DAS) move must be old
  # before it counts as evidence (stuck_pwm_lag); a quarter window, [0, 0.5]. The
  # move is measured over the oldest 1 - fraction of the window, so raising this
  # flags strictly less; half a window is the most that still leaves room to measure.
  stuck_pwm_lag_fraction: 0.25
  solver_max_iter: 50
  channels: [xt1, xt2, xt3, xt4, qd1, qd2, qd3, qd4]

  topology:
    zones:               # channels: every output whose fans move air through the zone
      z0: {channels: [xt1, qd1], coupled_to: [z1]}
      z1: {channels: [xt2, qd1, qd2], coupled_to: [z0, z2]}
      z2: {channels: [xt3, qd2, qd3], coupled_to: [z1, z3]}
      z3: {channels: [xt4, qd3, qd4], coupled_to: [z2]}
    # occupied: auto (the default: unknown until the estimator decides from
    # proximal minus zone air and SMART; constrained like an occupied bay).
    # A bay without class uses default_class (the strictest, hdd); a SMART
    # model matching drive_classes.<c>.models can set it, or declare class /
    # serial per bay here or with POST /api/bay. Without SES the estimator
    # associates SMART serials with bays by correlation; a declared serial wins.
    # limit_c tightens the class limit for one bay.
    bays:
      b01: {zone: z0}
      b02: {zone: z0}
      b03: {zone: z0}
      b04: {zone: z0}
      b05: {zone: z1}
      b06: {zone: z1}
      b07: {zone: z1}
      b08: {zone: z1}
      b09: {zone: z2}
      b10: {zone: z2}
      b11: {zone: z2}
      b12: {zone: z2}
      b13: {zone: z3}
      b14: {zone: z3}
      b15: {zone: z3}
    default_class: hdd

  # sensors: keys exactly temps. role inlet | zone_air | drive_proximal | exhaust.
  # quant_c 0.01 = thermistor, 0.0625 = DS18B20 (default). The Stuck rule is sized
  # per sensor: stuck_s defaults per role (proximal 1800 s, zone air 180 s, inlet /
  # exhaust 600 s), stuck_eps_c to 1.5 * quant_c, long windows decimated
  # (stuck_decimate). redundant: true marks a backup member of its group (one
  # trusted member is enough). tau_s: sensor lag, seconds.
  sensors:
    inlet_a: {role: inlet, quant_c: 0.01}
    inlet_b: {role: inlet, quant_c: 0.0625, redundant: true}
    air_z0: {role: zone_air, zone: z0, quant_c: 0.01}
    air_z1: {role: zone_air, zone: z1, quant_c: 0.01}
    air_z2: {role: zone_air, zone: z2, quant_c: 0.01}
    air_z3: {role: zone_air, zone: z3, quant_c: 0.01}
    prox_b01: {role: drive_proximal, zone: z0, bay: b01, tau_s: 15}
    prox_b02: {role: drive_proximal, zone: z0, bay: b02, tau_s: 15}
    prox_b03: {role: drive_proximal, zone: z0, bay: b03, tau_s: 15}
    prox_b03b: {role: drive_proximal, zone: z0, bay: b03, quant_c: 0.01, redundant: true}
    prox_b04: {role: drive_proximal, zone: z0, bay: b04, tau_s: 15}
    prox_b05: {role: drive_proximal, zone: z1, bay: b05, tau_s: 15}
    prox_b06: {role: drive_proximal, zone: z1, bay: b06, tau_s: 15}
    prox_b07: {role: drive_proximal, zone: z1, bay: b07, tau_s: 15}
    prox_b08: {role: drive_proximal, zone: z1, bay: b08, tau_s: 15}
    prox_b09: {role: drive_proximal, zone: z2, bay: b09, tau_s: 15}
    prox_b10: {role: drive_proximal, zone: z2, bay: b10, tau_s: 15}
    prox_b10b: {role: drive_proximal, zone: z2, bay: b10, redundant: true}
    prox_b11: {role: drive_proximal, zone: z2, bay: b11, tau_s: 15}
    prox_b12: {role: drive_proximal, zone: z2, bay: b12, tau_s: 15}
    prox_b13: {role: drive_proximal, zone: z3, bay: b13, tau_s: 15}
    prox_b14: {role: drive_proximal, zone: z3, bay: b14, tau_s: 15}
    prox_b15: {role: drive_proximal, zone: z3, bay: b15, tau_s: 15}
    exhaust_z0: {role: exhaust, zone: z0, quant_c: 0.01}
    exhaust_z2: {role: exhaust, zone: z2, quant_c: 0.01}

  drive_classes:         # owner decision: limit / comfort band / drive time constant; models: [regex] on the SMART model
    hdd: {limit_c: 50.0, comfort_c: 5.0, tau_d_s: 720.0}
    ssd_sata: {limit_c: 65.0, comfort_c: 10.0, tau_d_s: 200.0}
    nvme: {limit_c: 70.0, comfort_c: 10.0, tau_d_s: 120.0}

  # fans: keys exactly channels; count = fans on the output (splitter: 2, only
  # the first drives the tach). Optional: group (outputs sharing an air path; the
  # model and the experiments treat a group as one unit), noise_weight (penalise a
  # fan near the listening position), forbidden_pwm: [[lo, hi]] (resonance bands,
  # width <= 0.2; the DAS MPC snaps out of them upward).
  fans:
    xt1: {model: case120, count: 2}
    xt2: {model: case120, count: 2}
    xt3: {model: case120, count: 1}
    xt4: {model: case120, count: 1}
    qd1: {model: case120, count: 1}
    qd2: {model: case120, count: 1}
    qd3: {model: case120, count: 1}
    qd4: {model: case120, count: 1}
  fan_models:            # PWM -> RPM curve and noise at full speed; tools/fit_fans.py fits the curve
    # power_w_at_max (watts of ONE fan at full speed) has no default: measure it, or
    # leave it out and the fan-health power rule stays off for this model (item 79).
    case120: {rpm_max: 1500, deadband: 0.1, exponent: 1.0, noise_db_at_max: 30.0}
  # zones: trust_rule strict (a zone faults when a required sensor group has no
  # trusted member) or sigma (a zone faults when a bay's drive sigma or its air
  # sigma passes estimator.sigma_fault_c / sigma_air_fault_c: a lost sensor widens
  # the margin first; not with two proximal sensors on a bay at different
  # placements); fault_coupling declared (a zone fault also reaches the outputs of
  # the zones in its coupled_to) or none (strictly per zone).
  zones: {trust_rule: strict, fault_coupling: declared}
  # Soft sigma floor (trust_rule sigma only), defaults shown: when a zone loses its
  # air sensor or a bay's proximal sensors, its outputs stay at least at the command
  # before the loss until sigma_floor_hold_s (s, >= 0) has passed or the sigma of
  # every lost sensor group has grown by sigma_floor_growth_c (degC, > 0); then that
  # floor falls by sigma_floor_release_per_min (PWM per minute, > 0) until it is gone.
  #   zones: {trust_rule: sigma, fault_coupling: declared, sigma_floor_hold_s: 1800,
  #           sigma_floor_growth_c: 1.0, sigma_floor_release_per_min: 0.0025}
  noise: {exponent: 5.0, weight_noise: 1.0, band_hysteresis: 0.02}
  estimator:             # drive temperature estimator (per-zone Kalman filter), defaults shown
    k_sigma: 2.0         # margin = k_sigma * sigma; sigma >= 1.5 degC until SMART calibrates a bay
    sigma_fault_c: 4.0   # zones.trust_rule: sigma faults a zone past these (degC; > 1.5 with sigma)
    sigma_air_fault_c: 2.0
    air_blind_fault_s: 900  # zones.trust_rule: sigma faults a zone whose air node has had no
                         # trusted zone_air reading for this long (the air sigma barely grows,
                         # so it cannot decide on its own); 0 faults on the first blind tick
    q_t_air: 1.0e-4      # process noise per tick: air, air disturbance, drive, sensor node,
    q_d_air: 4.0e-7      # heat, and a proximal sensor's placement offset
    q_t_drive: 1.0e-5
    q_t_sensor: 1.0e-4
    q_heat: 4.0e-7
    q_offset: 1.0e-4
    sensor_noise_c: 0.03 # sensor white noise; variance adds quant_c^2 / 12
    proximal_offset_c: 3.0  # prior sigma of the placement offset the filter carries for every
                         # proximal sensor of a bay beyond the first (degC): two sensors on one
                         # bay sit differently and disagree by degrees, which is an offset to
                         # estimate, not a drive swap. 0: one node for all of them (the per-bay
                         # seeding of item 69 still applies, so 0 is not the pre-item-67 filter)
    smart_max_age_s: 300 # older SMART samples are ignored; a silent serial loses its bay
    smart_reject_c: 8.0  # a SMART value this far from the estimate is dropped
    occupied_dT_c: 2.0   # proximal minus zone air above this: a drive is there
    empty_dT_c: 0.7      # below this (and < 1 W) for empty_confirm_s: the bay is empty
    empty_confirm_s: 300
    occupancy_hold_s: 30 # a bay keeps its occupancy while blind this long (0: no debounce; <= smart_max_age_s)
    bay_settle_s: 600   # zones.trust_rule: sigma suspends a bay's sigma check for this long
                         # after the filter widens it on purpose (a swap, an occupancy change)
                         # while the bay is still read by a proximal sensor
    bay_settle_max_s: 1800  # ...and for at most this much in total, until the bay has run this
                         # long with neither a window nor a sigma over sigma_fault_c: a swap
                         # spends a window or two, a sensor that keeps jumping runs out and
                         # faults its zone again. 0: no settling exemption at all
    calibration_max_age_days: 30  # a SMART calibration without samples this long is not trusted
    calibrate_min_c: 5.0  # POST /api/calibrate: the drive temperature a handheld reading may
    calibrate_max_c: 80.0 # report, degC (min < max); narrowed at submit time to the gate's
                          # [temp_min_c, temp_max_c] -- a tighter gate is never a config error
    associate_window_s: 3600      # serial -> bay association by correlation (no SES)
    associate_min_corr: 0.8
    associate_margin: 0.15
    associate_drop_corr: 0.3      # a correlated pair is re-scored against its bay every
    associate_drop_checks: 3      # evaluation; this many (a whole number) in a row drop it
    sigma_uncalibrated_c: 1.5     # sigma floor of a bay without an accepted SMART calibration
    p0_t_air: 0.25       # initial variance per state kind: air, air disturbance, drive,
    p0_d_air: 2.5e-3     # sensor node, heat (the same order as the q_* above)
    p0_t_drive: 0.1
    p0_t_sensor: 0.1
    p0_heat: 2.5e-5
    reset_drive_var: 25.0  # drive variance a bay restarts from when a drive (possibly) arrived
    jump_min_c: 0.5      # fast-swap rule: a proximal innovation past both degC and sigmas
    jump_sigmas: 6.0     # widens the bay's margin at once and drops a correlated serial
  # Thermal model identification (control/thermal.py). model_shadow: true learns the
  # zoned model online after each tick's command is final and reports it (GET
  # /api/model, HA model_status and model_pred_err_c); the learning never moves a fan
  # itself. The DAS MPC (solver: mpc) plans on the model once it has converged, which
  # needs identification experiments (ident_* below): regulation alone never excites
  # the fan groups apart.
  model_shadow: false
  model_window_s: 120.0  # sin^2-weighted regression window (effective length about half), >= 2 * dt
  model_lambda: 0.9995   # RLS forgetting per excited window
  model_p_trace_max: 100.0
  model_converged_rel_se: 0.25  # every fan gain's relative standard error below this ...
  model_max_pred_err_c: 1.0     # ... and the one-window prediction error below this: converged
  model_use_rpm: false   # airflow from the tachometer instead of the PWM curve where one reports
  model_reset_on_swap: true  # a hot-swapped bay's g0, k and q_s start over from the prior
  # Freeze a converged model: with model_freeze the zone that reaches the converged rule is
  # entered frozen instead, and a zone that is already converged when the switch is turned on
  # freezes at its next closing window (no restart, no store file needed), so online
  # identification never moves its coefficients again. The DAS MPC accepts frozen exactly like
  # converged. It freezes a good model only: a zone whose prediction error later goes bad still
  # becomes suspect and learns again.
  model_freeze: false
  # Per-channel split of a fan group's effectiveness (control/thermal.py). Regulation moves a
  # group's channels together, so only the group coefficient E.<zone>.<group> is identifiable
  # from it; an experiment's single-channel phases move them apart. With model_split_channels
  # each group of more than one channel in a zone carries one extra coefficient per channel
  # beyond the first, whose regressor is exactly zero while the channels hold the same duty --
  # so under regulation the model is the shared-E model term for term, and the split only
  # redistributes the group's coefficient, never changes its total. GET /api/model then reports
  # e_per_channel per zone. A store file written with the switch the other way is converted.
  model_split_channels: false
  # Online PWM -> RPM curve per fan model (control/fancurve.py). With fan_curve_online the
  # daemon collects settled (pwm, rpm) pairs from every output that reports a speed, fits
  # rpm_max / deadband / exponent per fan model on the same grid tools/fit_fans.py uses, and
  # -- once a fit passes -- the thermal model and the DAS MPC plan on the fitted deadband and
  # exponent instead of the fan_models entry. The fitted rpm_max is reported only: model_use_rpm
  # keeps normalising the tachometer by the commissioned fan_models.<m>.rpm_max, so a fan that
  # loses speed still shows up as less air. The accepted curves live in the model store's fan_curves section,
  # so they survive a restart; the configured curve stays in force until a fit is accepted, and
  # a tach-less output is covered by the curve of its own fan model.
  fan_curve_online: false
  fan_curve_settle_s: 30.0     # a duty must hold this long before its (pwm, rpm) pair is sampled
  fan_curve_refit_s: 600.0     # shortest interval between two fits per fan model, seconds
  fan_curve_max_rmse_frac: 0.05  # a fit whose relative RMSE is worse than this is refused
  # DAS MPC (solver: mpc; control/solver_das.py): least modelled fan noise with every drive
  # under its targets, planned over horizon steps of mpc_pred_dt_s. It acts only on a model
  # that passes its validity gate (a converged thermal model, finite bounded parameters,
  # stable dynamics, a gain on every drive, prediction error and drift in bounds) and
  # otherwise regulates exactly like solver: pi, with mode staying auto.
  mpc_pred_dt_s: 30.0    # prediction step, seconds (>= dt)
  mpc_blocks: [1, 1, 2, 4, 6, 6]  # move blocks, sum = horizon
  mpc_every_ticks: 2     # solve every 2nd tick (Zero W budget at dt = 5 s); replay the plan between.
                         # item 73 fallback: 3, together with the raised budget_ms / budget_alarm_ms
                         # above; it cuts the mean step and the CPU share, not the p99 (the p99 over
                         # all ticks stays a solve tick while solve ticks are more than 1 % of them)
  rho_soft: 40.0         # penalty per degC^2 above a drive's soft target (limit - comfort - k sigma)
  rho_hard: 4000.0       # penalty per degC^2 above its hard target (limit - k sigma)
  solver_outer_max: 4    # active-piece iterations per solve
  # Validity gate, drift: the model's own rate for each drive against the rate the
  # estimator observes, both through the low-pass model_drift_rate_tau_s, so a load step or
  # a command move the model predicts is not a fault and the drives' physical warm-up is
  # not either. It has to keep failing for model_drift_dwell_s before the MPC gives way to
  # the PI-like DAS form (section 8 items 64 and 65). That dwell leaks: a passing tick does
  # not restart it and only a passing spell as long as the dwell does, because a moderate
  # parameter error holds its residual just over the limit and dips under it on noise.
  model_max_drift_c_per_min: 0.5
  model_drift_rate_tau_s: 120.0
  model_drift_dwell_s: 120.0
  # Validity gate, air disturbance: the fan gains E only move the air node, whose model the
  # estimator's per-zone air disturbance re-balances at any one operating point, so airflow
  # the enclosure no longer has (a blocked filter, a dust mat) leaves the drive rows clean.
  # What it cannot hide is the move: the check is that disturbance against its own slow
  # level (model_air_dist_tau_s), under model_drift_dwell_s like the drift. A level is a
  # reference only once it has run for model_air_dist_tau_s: until then (a fresh track, or
  # one a gap of over an hour made stale) the check reports null instead of no move. The
  # default is set above what the truth simulator's drawn physics produce on a healthy
  # enclosure, but not far above it: the healthy ceiling measured there is 7.44 degC/min
  # against this 8.0, so on a fitted model of the real enclosure this should come down --
  # section 8 items 66 and 96 have the measurements and the tuning.
  model_max_air_dist_c_per_min: 8.0
  model_air_dist_tau_s: 900.0
  # Back from the model fallback (PI-like DAS) to the MPC: the gate's numeric limits scaled
  # by model_return_factor must hold for model_return_dwell_s. The air-disturbance limit is
  # not scaled (it is a move, not a level), and the return's drift compares the model's
  # rate as it is, since in the fallback that rate is not answering a move of its own.
  model_return_factor: 0.5
  model_return_dwell_s: 300.0
  model_accept_prior: false  # true: act on the prior model (or what shadow learning has so far)
  # Model store: the daemon keeps the thermal model, the SMART calibrations and the last
  # bay view in $STATE_DIRECTORY/model.json (systemd StateDirectory=aqua-bridge) or
  # --model-store PATH. A file up to model_store_max_age_days old loads frozen and the MPC
  # acts on it (prediction-error guard on); an older one loads stale: the model learns in
  # shadow while the PI-like DAS form acts with the loaded calibrations at twice their
  # sigma_cal, and acts again only after converged for model_reconfirm_s.
  model_store_interval_s: 600.0
  model_store_max_age_days: 30.0
  model_reconfirm_s: 3600.0
  # Active identification experiments (control/ident.py): POST /api/ident {"action": "start",
  # "group": ...} (or MQTT cmd/ident start:group:<g>) steps one fan group, then each of its
  # channels, between two PWM levels while every drive the group cools stays within its
  # envelope (estimate <= soft + ident_max_over_c and <= hard -- k sigma is inside soft and
  # hard already -- and estimate + k sigma below limit - ident_abort_below_limit_c).
  # Explicit start only; any fallback or degraded tick, a human intent or stop aborts it.
  ident_enabled: false   # true: allow POST /api/ident and MQTT cmd/ident to start one
  ident_amplitude: 0.15  # PWM step, (0, 0.3]
  ident_levels: above    # above: never less cooling than the solver asks for
  ident_replan: true     # re-plan the levels from the live solver demand every tick; false
                         # freezes them at the base of the start (the Zero W behaviour)
  ident_hold_s: [60, 120, 180]  # hold times drawn by the seeded sequence (each >= 5 * dt)
  ident_max_duration_s: 1800    # the whole experiment, seconds
  ident_settle_s: 600    # every zone the group serves trusted this long before a start
  ident_start_band_c: 1.0  # start only with every drive within this of its soft target
  ident_max_over_c: 3.0  # abort when a drive's estimate exceeds soft + this
  ident_abort_below_limit_c: 1.0  # absolute abort: estimate + k sigma this far below the limit
  ident_settle_resume_max_gap_s: 300.0  # longest outage after which model.json's settle timers count
  ident_seed: 1

# Hardware bindings for --source composite: every mpc.temps name bound exactly once
# across the controllers' temp_maps and onewire.sensors, every channel by one fans map.
# Each controller is found under /sys/class/hidraw by USB id; tools/aquacomputer_probe.py
# lists what is attached. Input names: aquaero pwm1-8 / fan1-8 outputs and their
# tachometers (1-4 its own, 5-8 the Quadro's outputs 1-4 on its aquabus), temp1-8 physical
# sensors, bus1-8 aquabus temperature slots (the Quadro's sensors 1-4 in bus1-4), soft1-8
# software sensors, virt1-4 virtual sensors; Quadro pwm1-4 / fan1-4, temp1-4, soft1-16.
# A Quadro on aquabus ignores writes over its own USB, so a config that commands aquaero
# pwm5-8 and the outputs of a quadro entry without serial is refused; a quadro entry with
# a serial is taken as a second Quadro on its own USB port (logged as a warning).
aquacomputer:
  - device: aquaero
    # serial: "12345-54321"  # only needed when several of one kind are attached
    fans:
      xt1: {pwm: pwm1, rpm: fan1}
      xt2: {pwm: pwm2, rpm: fan2}
      xt3: {pwm: pwm3, rpm: fan3}
      xt4: {pwm: pwm4, rpm: fan4}
      qd1: {pwm: pwm5, rpm: fan5}   # the Quadro's outputs 1-4 on the aquaero's aquabus
      qd2: {pwm: pwm6, rpm: fan6}
      qd3: {pwm: pwm7, rpm: fan7}
      qd4: {pwm: pwm8, rpm: fan8}   # controller block 8 read unconfigured: writing it is unverified (logged)
    temp_map:            # the 8 thermistor inputs
      inlet_a: temp1
      air_z0: temp2
      air_z1: temp3
      air_z2: temp4
      air_z3: temp5
      prox_b03b: temp6
      exhaust_z0: temp7
      exhaust_z2: temp8
    # Timing per controller, defaults shown (PROJECT.md section 3, Track B). Writes take
    # effect at once and are not saved in the controller's memory:
    status_max_age_s: 3.0         # an older status report is no observation: fallback (> 0)
    ctrl_gap_ms: 100              # wait after a control operation before the next read or write, ms (>= 0; default aquaero 100, quadro 0)
    ctrl_retries: 1               # retries of a failed control operation, each from a fresh read (int 0..5)
    ctrl_budget_s: 5.0            # no control operation starts after this much of one write (> 0)
    ctrl_refresh_s: 60.0          # read the control report again this often (>= 0, 0 disables)
    duty_mismatch_tolerance: 100  # output duty this far from the written duty is a mismatch, 1/100 % (0..10000)
    duty_mismatch_s: 5.0          # a mismatch lasting longer re-reads and rewrites every channel (> 0)
    write_min_interval_s: 0.0     # a falling duty is written at most this often (>= 0; 0 writes every change; rises go out at once)
    write_deadband: 0             # a falling duty is written only this far below the written one, 1/100 % (0..10000; 0 writes every change)
    heartbeat_sensor: 0           # software sensor softN (aquaero 1..8) the daemon writes on every tick
                                  # that commanded the duties, as a hardware watchdog; 0 is off (the
                                  # controller's own timeout, fallback temperature and alarm action are
                                  # set on the device itself). Shown here at its default, but 0 is right
                                  # only while no software sensor is enabled on the controller: this
                                  # aquaero has soft1 enabled (30 s, fallback 90.00 degC, alarm -> the
                                  # 100 % profile 2; PROJECT.md section 2 "Software-sensor heartbeat and
                                  # profiles"), so with 0 that sensor falls back 30 s after boot, the
                                  # alarm selects profile 2 for good and the watchdog can never fire
                                  # again. Set heartbeat_sensor: 1 once the daemon's heartbeat has run
                                  # against the hardware (PROJECT.md section 8 item 93).
    heartbeat_value_c: 20.0       # the temperature the heartbeat writes, degC: below the sensor's alarm
  # The alternative, the Quadro on its own USB port instead of aquabus: remove qd1-qd4
  # from the aquaero entry above and add
  # - device: quadro
  #   fans:
  #     qd1: {pwm: pwm1, rpm: fan1}
  #     qd2: {pwm: pwm2, rpm: fan2}
  #     qd3: {pwm: pwm3, rpm: fan3}
  #     qd4: {pwm: pwm4, rpm: fan4}
  #   temp_map: {}         # bind Quadro inputs only once they are connected
  #   ctrl_gap_ms: 0       # the one timing default that differs: the Quadro needs no gap

# Fan-health drift monitoring (PROJECT.md section 3 "Fan and device health", section 8
# item 79). Every status report carries each output's rpm, output duty, 12 V rail
# voltage, current and power; they are recorded (the record's "fans" key) and published
# (/api/state's device_health, the MQTT state blob, the page) either way, and these keys
# decide when a deviation is reported. Defaults shown. The rpm rule compares against the
# mpc.fan_models curve tools/fit_fans.py fits; the power rule needs
# fan_models.<m>.power_w_at_max and is off until one is measured. The aquaero reports
# 0 mA and 0 W for its own outputs (pwm1-4) in PWM mode, so the power rule never judges
# them; only its aquabus outputs (pwm5-8, the Quadro's) report a real draw.
fan_health:
  enabled: true              # false: the readings are still recorded and published, no rule runs
  min_duty: 0.25             # below this output duty no rpm or power rule fires (0..1)
  settle_s: 15.0             # the rpm and power rules judge a reading against the band the duty
                             # spanned over this long, and judge nothing until that much has
                             # accumulated (>= 0): an aquabus fan's rpm in the aquaero's report
                             # lags several seconds, so a step must not read as drift
  rpm_tolerance_frac: 0.25   # a speed this fraction of rpm_max outside the band is a deviation
  rpm_fault_s: 120.0         # an rpm deviation held this long is reported, seconds (> 0)
  rail_min_v: 11.0           # 12 V rail window, volts; a block reading 0.0 V is not judged
  rail_max_v: 13.0           # (that is an empty aquabus slot, not a dead rail); max > min
  rail_fault_s: 30.0         # a rail excursion held this long is reported, seconds (> 0); the
                             # rail rule needs no duty, so it is judged while the duty moves too
  power_tolerance_frac: 0.5  # measured power this fraction outside the band is a deviation
  power_exponent: 3.0        # expected power = power_w_at_max * phi(duty) ** this (fan law, > 0)
  power_min_w: 0.2           # expected power below this is not judged, watts (>= 0)
  power_fault_s: 120.0       # a power deviation held this long is reported, seconds (> 0)
  log_interval_s: 300.0      # one log line per channel at most this often, seconds (> 0)

# The Raspberry Pi's own temperature and throttling as a health signal (PROJECT.md
# section 3 "Fan and device health", section 8 item 103 and the owner decision of
# 2026-09-16 in section 8.1). The board is NOT part of the thermal model: about a watt
# against the drives' tens of watts, and its reading is dominated by its own
# self-heating. It is never a solver input, never a zone air sensor, never a model node
# -- these rules only produce a published field and a log line. Defaults shown.
host_health:
  enabled: true              # false: the board's temperature and throttling are still
                             # read, published and shown; no rule runs
  temp_limit_c: 75.0         # the board above this is a deviation, degC: the Pi caps its
                             # ARM clock around 80 and hard-throttles around 85, so this
                             # warns before the board starts defending itself
  temp_fault_s: 120.0        # held this long it is reported, seconds (> 0): a build or an
                             # update heats the SoC for tens of seconds; two minutes is
                             # placement or airflow
  divergence_c: 40.0         # the board further than this from the enclosure air is a
                             # deviation while the CPU is idle, degC (> 0). A coarse
                             # backstop: an un-heatsinked Zero 2 W idles 20-25 degC above
                             # the air around it (the owner's reads 47.2 degC at idle), so
                             # a healthy board is already that far from a room-temperature
                             # reference. Narrow it only from a measured board-vs-air
                             # delta. Judged on the absolute difference, either way round
  divergence_fault_s: 900.0  # a divergence held this long, idle throughout, is reported,
                             # seconds (> 0); the enclosure's air moves in minutes
  idle_load1_max: 0.5        # the CPU counts as idle at or below this load1 (>= 0): above
                             # it the board's reading says more about the CPU than the air,
                             # so the divergence rule is not evidence of anything
  air_temps: []              # the temperatures averaged as the enclosure-air reference;
                             # empty means every zone_air sensor, else every inlet sensor,
                             # else every configured temperature
  log_interval_s: 300.0      # one log line for the board at most this often, seconds (> 0)
  vcgencmd_interval_s: 60.0  # how often a reader may run `vcgencmd get_throttled`,
                             # seconds (> 0). On a Raspberry Pi Zero 2 W with kernel
                             # 6.18 the firmware exposes no get_throttled sysfs
                             # attribute, so that process is the only source of the
                             # whole word and the control tick uses it too; one fork
                             # costs 3.3 ms there (3.8 ms p95), so once a minute is
                             # 0.07 % of the one 5 s tick it lands on and 0.5 % of
                             # mpc.budget_ms. The last word is served in between,
                             # tagged with its age. Lower it to notice throttling
                             # sooner, at one 3.3 ms fork per interval
  vcgencmd_timeout_s: 2.0    # how long one `vcgencmd get_throttled` may take, seconds
                             # (> 0); it guards against a VideoCore mailbox that never
                             # answers. A timeout is simply unknown, and the chain
                             # falls through to the rpi_volt hwmon under-voltage bit

# 1-Wire: two w1-gpio buses (dtoverlay=w1-gpio,gpiopin=4 and gpiopin=17 in
# config.txt); bus masters are discovered under root (default /sys/bus/w1/devices).
# Bind ROM ids with tools/w1_commission.py --list / --identify and verify the
# bindings, cycle time and CRC error rate with --check --config this file.
onewire:
  resolution_bits: 12    # 9..12; 11 halves the conversion time
  max_age_s: 7.5         # 1.5 * dt: an older sample reads as missing
  sensors:               # logical name -> DS18B20 ROM id (tools/w1_commission.py --identify)
    inlet_b: 28-000000000001
    prox_b01: 28-000000000002
    prox_b02: 28-000000000003
    prox_b03: 28-000000000004
    prox_b04: 28-000000000005
    prox_b05: 28-000000000006
    prox_b06: 28-000000000007
    prox_b07: 28-000000000008
    prox_b08: 28-000000000009
    prox_b09: 28-00000000000a
    prox_b10: 28-00000000000b
    prox_b10b: 28-00000000000c
    prox_b11: 28-00000000000d
    prox_b12: 28-00000000000e
    prox_b13: 28-00000000000f
    prox_b14: 28-000000000010
    prox_b15: 28-000000000011

http:
  # HTTPS with basic auth only; there is no plain-HTTP listener (PROJECT.md section 6).
  # With enabled: true but a missing or invalid certificate, key or credentials
  # file the API stays off (logged) and the daemon keeps controlling the fans.
  enabled: false
  bind: 0.0.0.0
  port: 8443
  # PEM certificate and key; deploy/install-pi.sh creates a self-signed pair if absent.
  # The key must be mode 0640 root:<service user>.
  tls_cert: /etc/aqua-bridge/tls/cert.pem
  tls_key: /etc/aqua-bridge/tls/key.pem
  # One user:pbkdf2_sha256$... line per user, mode 0640 root:<service user>;
  # create users with tools/http_user.py. Reread when it changes.
  credentials_file: /etc/aqua-bridge/http-users
  realm: aqua-bridge
  # PBKDF2-HMAC-SHA256 iterations for newly written hashes (tools/http_user.py);
  # each uncached check costs this many iterations of CPU on the Pi.
  hash_iterations: 100000
  # Seconds a verified user:password is cached (the page polls every 2 s); 0 = no cache.
  auth_cache_s: 300
  # After auth_fail_limit consecutive failed logins a client gets 429 for
  # auth_backoff_s, doubling per further failure up to auth_backoff_max_s; 0 = off.
  auth_fail_limit: 5
  auth_backoff_s: 1
  auth_backoff_max_s: 300
  # Global limit on uncached password checks (one PBKDF2 each, about 1.2 s of the
  # Zero W's single core at 100000 iterations), across every client address: at most
  # auth_verify_max start per auth_verify_window_s (0 = no window limit) and at most
  # auth_verify_pending_max are admitted and unfinished at once; beyond either a
  # request that needs a check gets 429. A cached login is never limited.
  auth_verify_max: 6
  auth_verify_window_s: 60
  auth_verify_pending_max: 2
  # Added to the nice value of the thread that runs the checks (Linux, 0-19; 0 = same
  # priority as the control loop).
  auth_verify_nice: 10

digole:
  device: /dev/serial0
  baud: 9600
  enabled: false
