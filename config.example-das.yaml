# Zoned DAS example (PROJECT.md): 4 zones, 15 hot-swap bays, 8 PWM outputs
# (aquaero 6 XT xt1-xt4 + Quadro qd1-qd4, 1-2 fans per output, one tach per
# output), 25 sensors (8 thermistors on the aquaero inputs, 17 DS18B20 on
# 1-Wire; the Quadro's inputs are not bound: how many are usable is known only
# once it is connected). Copy to /etc/aqua-bridge/config.yaml on the Pi and
# replace the names, hwmon attributes and ROM ids with your own.
#
# Run it with --source hwmon (hwmon: + onewire: below; the systemd unit needs
# a drop-in for that -- deploy/install-pi.sh --das installs one, PROJECT.md
# section 10) or, without hardware, with
# --source sim --sim-plant das (the DAS truth simulator built from the topology
# below; an optional top-level "sim: {das: {preset: basic|rich, seed: 0}}"
# section tunes it). --record PATH (or a top-level record_path, with
# record_max_bytes / record_backup_count) records every tick for
# tools/fit_model.py, tools/fit_fans.py and tools/replay.py.
#
# DAS mode: mpc.topology present and mpc.setpoints empty. Each sensor is gated
# on its own; a zone is trusted while every required sensor group (its zone
# air, the proximal sensors of each occupied or unknown bay) has a trusted
# member. A zone in fault holds, then ramps high, every output that moves air
# through it or through a zone coupled to it (mode "degraded"; "fallback" when
# every zone is in fault); the other outputs keep regulating. A fault never
# reduces cooling.
#
# Solvers: "pi" regulates the drives' margins (PI-like DAS form): per output,
# the worst drive of the zones it serves decides. "mpc" is the DAS MPC: least
# modelled fan noise with every drive under its targets, acting only on a
# model that passes its validity gate, else regulating exactly like "pi".
# Drive temperatures are estimated from the proximal and zone-air sensors
# (per-zone Kalman filter, margin k_sigma * sigma); the limits come from
# drive_classes. Runtime changes go through POST /api/limit {bay|class,
# limit_c} (MQTT {node_id}/cmd/limit/<bay> and {node_id}/cmd/limit/class/<class>);
# a runtime limit can only be at or below the one written here. POST /api/bay
# declares a bay's occupancy, class or serial. Presets: quiet = comfort band
# -2 degC and noise weight x2, cool = comfort band +2 degC and noise weight x0.5.

mqtt:
  enabled: false
  host: mqtt.local
  port: 1883
  username: ""
  password: ""
  discovery_prefix: homeassistant
  node_id: aqua-bridge

host:
  interval_s: 5

mpc:
  solver: pi             # pi: PI-like DAS solver (margin deficit per output); mpc: DAS MPC
  dt: 5.0                # seconds per tick; drive time constants are minutes
  horizon: 20            # DAS MPC prediction steps of mpc_pred_dt_s (10 minutes)
  temps:                 # every sensor the gate checks; keys of sensors below
    - inlet_a
    - inlet_b
    - air_z0
    - air_z1
    - air_z2
    - air_z3
    - prox_b01
    - prox_b02
    - prox_b03
    - prox_b03b
    - prox_b04
    - prox_b05
    - prox_b06
    - prox_b07
    - prox_b08
    - prox_b09
    - prox_b10
    - prox_b10b
    - prox_b11
    - prox_b12
    - prox_b13
    - prox_b14
    - prox_b15
    - exhaust_z0
    - exhaust_z2
  setpoints: {}          # not used in DAS mode: drives are regulated to their class limits
  channel_temps: {}      # must stay empty with topology
  weights: {}
  weight_pwm: 0.0
  weight_dpwm: 1.0       # DAS MPC: penalty per PWM^2 between move blocks (damps the plan)
  mpc_tau_s: 120.0       # legacy MPC model only
  mpc_gain_c_per_pwm: 8.0
  mpc_estimator_gain: 0.1
  budget_ms: 600.0        # runtime alarm + CI/Pi bench gate: warn past this step() time, ms (> 0);
                           # §8.1 owner decision 2026-09-14, measured DAS MPC p99 507-552 ms on the Zero W
  budget_alarm_ms: 750.0  # error instead past this, ms (> budget_ms)
  budget_log_interval_s: 60.0  # rate limit for both budget log lines, seconds (> 0)
  pi_kp: 0.02            # PWM per degC of margin deficit (> 0)
  pi_ki: 0.0001          # PWM per (degC * s); integral time pi_kp / pi_ki = 200 s
  pwm_min: 0.2
  pwm_max: 1.0
  d_pwm_max: 0.1         # max |delta pwm| per tick
  fallback_pwm:          # HIGH cooling on a zone fault; keys exactly channels
    xt1: 0.8
    xt2: 0.8
    xt3: 0.8
    xt4: 0.8
    qd1: 0.8
    qd2: 0.8
    qd3: 0.8
    qd4: 0.8
  fallback_hold_s: 30    # hold the last command this long in a zone fault, then ramp high
  confirm_s: 15          # consecutive trusted seconds before a zone returns; >= 2*dt, <= hold
  dT_max_c_per_s: 1.0    # gate slew limit, degC/s
  temp_min_c: -20.0
  temp_max_c: 120.0
  median3: false
  stuck_s: 600           # legacy global Stuck window; DAS sensors use the per-role values
  stuck_eps_c: 0.1
  stuck_pwm_net: 0.15    # legacy per-channel PWM evidence; DAS sensors use stuck_airflow_net
  stuck_sibling_dT_c: 1.0  # a sibling's plausible net move (same zone and role; proximal: same bay)
  # DAS Stuck evidence (PROJECT.md section 3, "Stuck sizing"): a sensor frozen in its band
  # is flagged when its zone's relative airflow (sum of count-weighted fan curves, block
  # means over the window) moved by more than stuck_airflow_net, (0, 1]; for a proximal
  # sensor not when every zone-air sensor moved against that move (warmer after more
  # airflow, cooler after less) by more than stuck_air_oppose_c, degC (> 0).
  stuck_airflow_net: 0.15
  stuck_air_oppose_c: 0.3
  solver_max_iter: 50
  channels: [xt1, xt2, xt3, xt4, qd1, qd2, qd3, qd4]

  topology:
    zones:               # channels: every output whose fans move air through the zone
      z0: {channels: [xt1, qd1], coupled_to: [z1]}
      z1: {channels: [xt2, qd1, qd2], coupled_to: [z0, z2]}
      z2: {channels: [xt3, qd2, qd3], coupled_to: [z1, z3]}
      z3: {channels: [xt4, qd3, qd4], coupled_to: [z2]}
    # occupied: auto (the default: unknown until the estimator decides from
    # proximal minus zone air and SMART; constrained like an occupied bay).
    # A bay without class uses default_class (the strictest, hdd); a SMART
    # model matching drive_classes.<c>.models can set it, or declare class /
    # serial per bay here or with POST /api/bay. Without SES the estimator
    # associates SMART serials with bays by correlation; a declared serial wins.
    # limit_c tightens the class limit for one bay.
    bays:
      b01: {zone: z0}
      b02: {zone: z0}
      b03: {zone: z0}
      b04: {zone: z0}
      b05: {zone: z1}
      b06: {zone: z1}
      b07: {zone: z1}
      b08: {zone: z1}
      b09: {zone: z2}
      b10: {zone: z2}
      b11: {zone: z2}
      b12: {zone: z2}
      b13: {zone: z3}
      b14: {zone: z3}
      b15: {zone: z3}
    default_class: hdd

  # sensors: keys exactly temps. role inlet | zone_air | drive_proximal | exhaust.
  # quant_c 0.01 = thermistor, 0.0625 = DS18B20 (default). The Stuck rule is sized
  # per sensor: stuck_s defaults per role (proximal 1800 s, zone air 180 s, inlet /
  # exhaust 600 s), stuck_eps_c to 1.5 * quant_c, long windows decimated
  # (stuck_decimate). redundant: true marks a backup member of its group (one
  # trusted member is enough). tau_s: sensor lag, seconds.
  sensors:
    inlet_a: {role: inlet, quant_c: 0.01}
    inlet_b: {role: inlet, quant_c: 0.0625, redundant: true}
    air_z0: {role: zone_air, zone: z0, quant_c: 0.01}
    air_z1: {role: zone_air, zone: z1, quant_c: 0.01}
    air_z2: {role: zone_air, zone: z2, quant_c: 0.01}
    air_z3: {role: zone_air, zone: z3, quant_c: 0.01}
    prox_b01: {role: drive_proximal, zone: z0, bay: b01, tau_s: 15}
    prox_b02: {role: drive_proximal, zone: z0, bay: b02, tau_s: 15}
    prox_b03: {role: drive_proximal, zone: z0, bay: b03, tau_s: 15}
    prox_b03b: {role: drive_proximal, zone: z0, bay: b03, quant_c: 0.01, redundant: true}
    prox_b04: {role: drive_proximal, zone: z0, bay: b04, tau_s: 15}
    prox_b05: {role: drive_proximal, zone: z1, bay: b05, tau_s: 15}
    prox_b06: {role: drive_proximal, zone: z1, bay: b06, tau_s: 15}
    prox_b07: {role: drive_proximal, zone: z1, bay: b07, tau_s: 15}
    prox_b08: {role: drive_proximal, zone: z1, bay: b08, tau_s: 15}
    prox_b09: {role: drive_proximal, zone: z2, bay: b09, tau_s: 15}
    prox_b10: {role: drive_proximal, zone: z2, bay: b10, tau_s: 15}
    prox_b10b: {role: drive_proximal, zone: z2, bay: b10, redundant: true}
    prox_b11: {role: drive_proximal, zone: z2, bay: b11, tau_s: 15}
    prox_b12: {role: drive_proximal, zone: z2, bay: b12, tau_s: 15}
    prox_b13: {role: drive_proximal, zone: z3, bay: b13, tau_s: 15}
    prox_b14: {role: drive_proximal, zone: z3, bay: b14, tau_s: 15}
    prox_b15: {role: drive_proximal, zone: z3, bay: b15, tau_s: 15}
    exhaust_z0: {role: exhaust, zone: z0, quant_c: 0.01}
    exhaust_z2: {role: exhaust, zone: z2, quant_c: 0.01}

  drive_classes:         # owner decision: limit / comfort band / drive time constant; models: [regex] on the SMART model
    hdd: {limit_c: 50.0, comfort_c: 5.0, tau_d_s: 720.0}
    ssd_sata: {limit_c: 65.0, comfort_c: 10.0, tau_d_s: 200.0}
    nvme: {limit_c: 70.0, comfort_c: 10.0, tau_d_s: 120.0}

  # fans: keys exactly channels; count = fans on the output (splitter: 2, only
  # the first drives the tach). Optional: group (outputs sharing an air path; the
  # model and the experiments treat a group as one unit), noise_weight (penalise a
  # fan near the listening position), forbidden_pwm: [[lo, hi]] (resonance bands,
  # width <= 0.2; the DAS MPC snaps out of them upward).
  fans:
    xt1: {model: case120, count: 2}
    xt2: {model: case120, count: 2}
    xt3: {model: case120, count: 1}
    xt4: {model: case120, count: 1}
    qd1: {model: case120, count: 1}
    qd2: {model: case120, count: 1}
    qd3: {model: case120, count: 1}
    qd4: {model: case120, count: 1}
  fan_models:            # PWM -> RPM curve and noise at full speed; tools/fit_fans.py fits the curve
    case120: {rpm_max: 1500, deadband: 0.1, exponent: 1.0, noise_db_at_max: 30.0}
  # zones: trust_rule strict (sigma is accepted but applies strict for now);
  # fault_coupling declared (a zone fault also reaches the outputs of the zones
  # in its coupled_to) or none (strictly per zone).
  zones: {trust_rule: strict, fault_coupling: declared}
  noise: {exponent: 5.0, weight_noise: 1.0, band_hysteresis: 0.02}
  estimator:             # drive temperature estimator (per-zone Kalman filter), defaults shown
    k_sigma: 2.0         # margin = k_sigma * sigma; sigma >= 1.5 degC until SMART calibrates a bay
    sigma_fault_c: 4.0   # reserved for zones.trust_rule: sigma (not evaluated yet)
    sigma_air_fault_c: 2.0
    q_t_air: 1.0e-4      # process noise per tick: air, air disturbance, drive, sensor node, heat
    q_d_air: 4.0e-7
    q_t_drive: 1.0e-5
    q_t_sensor: 1.0e-4
    q_heat: 4.0e-7
    sensor_noise_c: 0.03 # sensor white noise; variance adds quant_c^2 / 12
    smart_max_age_s: 300 # older SMART samples are ignored; a silent serial loses its bay
    smart_reject_c: 8.0  # a SMART value this far from the estimate is dropped
    occupied_dT_c: 2.0   # proximal minus zone air above this: a drive is there
    empty_dT_c: 0.7      # below this (and < 1 W) for empty_confirm_s: the bay is empty
    empty_confirm_s: 300
    bay_settle_s: 600
    calibration_max_age_days: 30  # a SMART calibration without samples this long is not trusted
    associate_window_s: 3600      # serial -> bay association by correlation (no SES)
    associate_min_corr: 0.8
    associate_margin: 0.15
  # Thermal model identification (control/thermal.py). model_shadow: true learns the
  # zoned model online after each tick's command is final and reports it (GET
  # /api/model, HA model_status and model_pred_err_c); the learning never moves a fan
  # itself. The DAS MPC (solver: mpc) plans on the model once it has converged, which
  # needs identification experiments (ident_* below): regulation alone never excites
  # the fan groups apart.
  model_shadow: false
  model_window_s: 120.0  # sin^2-weighted regression window (effective length about half), >= 2 * dt
  model_lambda: 0.9995   # RLS forgetting per excited window
  model_p_trace_max: 100.0
  model_converged_rel_se: 0.25  # every fan gain's relative standard error below this ...
  model_max_pred_err_c: 1.0     # ... and the one-window prediction error below this: converged
  model_use_rpm: false   # airflow from the tachometer instead of the PWM curve where one reports
  # DAS MPC (solver: mpc; control/solver_das.py): least modelled fan noise with every drive
  # under its targets, planned over horizon steps of mpc_pred_dt_s. It acts only on a model
  # that passes its validity gate (a converged thermal model, finite bounded parameters,
  # stable dynamics, a gain on every drive, prediction error and drift in bounds) and
  # otherwise regulates exactly like solver: pi, with mode staying auto.
  mpc_pred_dt_s: 30.0    # prediction step, seconds (>= dt)
  mpc_blocks: [1, 1, 2, 4, 6, 6]  # move blocks, sum = horizon
  mpc_every_ticks: 2     # solve every 2nd tick (Zero W budget at dt = 5 s); replay the plan between
  rho_soft: 40.0         # penalty per degC^2 above a drive's soft target (limit - comfort - k sigma)
  rho_hard: 4000.0       # penalty per degC^2 above its hard target (limit - k sigma)
  solver_outer_max: 4    # active-piece iterations per solve
  model_max_drift_c_per_min: 0.5  # validity gate: the model's drive drift at the estimate
  model_accept_prior: false  # true: act on the prior model (or what shadow learning has so far)
  # Model store: the daemon keeps the thermal model, the SMART calibrations and the last
  # bay view in $STATE_DIRECTORY/model.json (systemd StateDirectory=aqua-bridge) or
  # --model-store PATH. A file up to model_store_max_age_days old loads frozen and the MPC
  # acts on it (prediction-error guard on); an older one loads stale: the model learns in
  # shadow while the PI-like DAS form acts with the loaded calibrations at twice their
  # sigma_cal, and acts again only after converged for model_reconfirm_s.
  model_store_interval_s: 600.0
  model_store_max_age_days: 30.0
  model_reconfirm_s: 3600.0
  # Active identification experiments (control/ident.py): POST /api/ident {"action": "start",
  # "group": ...} (or MQTT cmd/ident start:group:<g>) steps one fan group, then each of its
  # channels, between two PWM levels while every drive the group cools stays within its
  # envelope (estimate + k sigma <= soft + ident_max_over_c, <= hard, < limit - 1 degC).
  # Explicit start only; any fallback or degraded tick, a human intent or stop aborts it.
  ident_enabled: false   # true: allow POST /api/ident and MQTT cmd/ident to start one
  ident_amplitude: 0.15  # PWM step, (0, 0.3]
  ident_levels: above    # above: never less cooling than the solver's level at start
  ident_hold_s: [60, 120, 180]  # hold times drawn by the seeded sequence (each >= 5 * dt)
  ident_max_duration_s: 1800    # the whole experiment, seconds
  ident_settle_s: 600    # every zone the group serves trusted this long before a start
  ident_start_band_c: 1.0  # start only with every drive within this of its soft target
  ident_max_over_c: 3.0  # abort when a drive's estimate + k sigma exceeds soft + this
  ident_seed: 1

# Hardware bindings for --source hwmon: every mpc.temps name bound exactly once
# across the hwmon temp_maps and onewire.sensors, every channel by one fans map.
hwmon:
  - name: aquaero
    fans:
      xt1: {pwm: pwm1, rpm: fan1}
      xt2: {pwm: pwm2, rpm: fan2}
      xt3: {pwm: pwm3, rpm: fan3}
      xt4: {pwm: pwm4, rpm: fan4}
    temp_map:            # the 8 thermistor inputs
      inlet_a: temp1
      air_z0: temp2
      air_z1: temp3
      air_z2: temp4
      air_z3: temp5
      prox_b03b: temp6
      exhaust_z0: temp7
      exhaust_z2: temp8
  - name: quadro         # its own USB port if its PWM is not writable through the aquaero
    fans:
      qd1: {pwm: pwm1, rpm: fan1}
      qd2: {pwm: pwm2, rpm: fan2}
      qd3: {pwm: pwm3, rpm: fan3}
      qd4: {pwm: pwm4, rpm: fan4}
    temp_map: {}         # bind Quadro inputs only once they show up in hwmon

# 1-Wire: two w1-gpio buses (dtoverlay=w1-gpio,gpiopin=4 and gpiopin=17 in
# config.txt); bus masters are discovered under root (default /sys/bus/w1/devices).
# Bind ROM ids with tools/w1_commission.py --list / --identify and verify the
# bindings, cycle time and CRC error rate with --check --config this file.
onewire:
  resolution_bits: 12    # 9..12; 11 halves the conversion time
  max_age_s: 7.5         # 1.5 * dt: an older sample reads as missing
  sensors:               # logical name -> DS18B20 ROM id (tools/w1_commission.py --identify)
    inlet_b: 28-000000000001
    prox_b01: 28-000000000002
    prox_b02: 28-000000000003
    prox_b03: 28-000000000004
    prox_b04: 28-000000000005
    prox_b05: 28-000000000006
    prox_b06: 28-000000000007
    prox_b07: 28-000000000008
    prox_b08: 28-000000000009
    prox_b09: 28-00000000000a
    prox_b10: 28-00000000000b
    prox_b10b: 28-00000000000c
    prox_b11: 28-00000000000d
    prox_b12: 28-00000000000e
    prox_b13: 28-00000000000f
    prox_b14: 28-000000000010
    prox_b15: 28-000000000011

http:
  # HTTPS with basic auth only; there is no plain-HTTP listener (PROJECT.md section 6).
  # With enabled: true but a missing or invalid certificate, key or credentials
  # file the API stays off (logged) and the daemon keeps controlling the fans.
  enabled: false
  bind: 0.0.0.0
  port: 8443
  # PEM certificate and key; deploy/install-pi.sh creates a self-signed pair if absent.
  # The key must be mode 0640 root:<service user>.
  tls_cert: /etc/aqua-bridge/tls/cert.pem
  tls_key: /etc/aqua-bridge/tls/key.pem
  # One user:pbkdf2_sha256$... line per user, mode 0640 root:<service user>;
  # create users with tools/http_user.py. Reread when it changes.
  credentials_file: /etc/aqua-bridge/http-users
  realm: aqua-bridge
  # PBKDF2-HMAC-SHA256 iterations for newly written hashes (tools/http_user.py);
  # each uncached check costs this many iterations of CPU on the Pi.
  hash_iterations: 100000
  # Seconds a verified user:password is cached (the page polls every 2 s); 0 = no cache.
  auth_cache_s: 300
  # After auth_fail_limit consecutive failed logins a client gets 429 for
  # auth_backoff_s, doubling per further failure up to auth_backoff_max_s; 0 = off.
  auth_fail_limit: 5
  auth_backoff_s: 1
  auth_backoff_max_s: 300

digole:
  device: /dev/serial0
  baud: 9600
  enabled: false
