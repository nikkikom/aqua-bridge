<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aqua-bridge</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 12px 16px; background: #111; color: #ddd; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  section { border: 1px solid #333; border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: #999; margin: 0 0 6px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 2px 4px; }
  td.k { color: #999; }
  td.v { text-align: right; font-variant-numeric: tabular-nums; }
  #fault { display: none; background: #a33; color: #fff; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-weight: bold; }
  #fault.show { display: block; }
  #degraded { display: none; background: #a70; color: #fff; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-weight: bold; }
  #degraded.show { display: block; }
</style>
</head>
<body>
<h1>aqua-bridge</h1>
<div id="fault">FAULT</div>
<div id="degraded">DEGRADED</div>

<section id="overview"><h2>Overview</h2><table></table></section>
<section id="temps"><h2>Temps</h2><table></table></section>
<section id="fans"><h2>Fans</h2><table></table></section>
<section id="devices"><h2>Controllers</h2><table></table></section>
<section id="drives" hidden><h2>Drives</h2><table></table></section>
<section id="zones" hidden><h2>Zones</h2><table></table></section>
<section id="model" hidden><h2>Model</h2><table></table></section>
<section id="mpc"><h2>MPC</h2><table></table></section>
<section id="host"><h2>Host</h2><table></table></section>

<script>
function row(k, v) {
  return "<tr><td class=k>" + k + "</td><td class=v>" + v + "</td></tr>";
}
function fmt(v, digits) {
  if (v === null || v === undefined) return "-";
  if (typeof v === "number") return v.toFixed(digits === undefined ? 2 : digits);
  return String(v);
}
// One measured field of a fan verdict, saying so when the rule that judges it did not
// run (§8 item 117). The number is kept where there is one -- it is still a reading --
// and only the claim that something checked it is dropped.
function note(text, rule, monitored, value) {
  if (monitored !== false) return text;
  if (value === null || value === undefined) return rule + " not monitored";
  return text + " (" + rule + " not monitored)";
}
function table(id, rows) {
  document.querySelector("#" + id + " table").innerHTML = rows.join("");
}
async function getJson(path) {
  const res = await fetch(path);
  return res.ok ? res.json() : null;
}

// Drives: /api/estimate (live temperature, margin, sigma) joined with
// /api/bays (the declared occupancy and class) -- the two existing DAS views.
// The calibration behind each estimate is named too: "cal smart", "cal manual"
// (POST /api/calibrate, item 23) or "uncal" when the bay runs on the prior map.
function renderDrives(est, bayView) {
  const estimates = (est || {}).estimates || {};
  const declared = (bayView || {}).bays || {};
  const rows = Object.keys(declared).sort().map(function (bay) {
    const d = declared[bay].declared || {};
    const seen = declared[bay].estimator || {};
    const e = estimates[bay];
    const label = bay + " (" + fmt(d.class) + ", " + fmt(d.occupied) + ")";
    const cal = seen.calibrated ? "cal " + fmt(seen.calibration_source) : "uncal";
    const value = e
      ? fmt(e.t_c) + " C, margin " + fmt(e.limit_margin_c) + " C, sigma " + fmt(e.sigma_c)
        + ", " + cal
      : "-";
    return row(label, value);
  });
  table("drives", rows);
}

// Zones: /api/zones -- per-zone trust, fault state and which channels are
// currently held or ramped under that zone's (or a coupled zone's) fault.
function renderZones(zoneView) {
  const zones = (zoneView || {}).zones || {};
  const rows = Object.keys(zones).sort().map(function (zone) {
    const zi = zones[zone];
    const flags = (zi.fault ? " FAULT" : "") + (!zi.fault && zi.in_closure ? " coupled" : "");
    const fallback = zi.channels_under_fallback || [];
    const value = fmt(zi.policy) + (fallback.length ? " [" + fallback.join(", ") + "]" : "");
    return row(zone + flags, value);
  });
  table("zones", rows);
}

// "<n> (smart: a, b; manual: c)": which bays have an accepted sensor-to-drive map
// and where it came from (/api/model's per-bay calibration block).
function calibratedBays(model) {
  const cal = (model || {}).calibration || {};
  const bySource = {};
  let total = 0;
  for (const bay of Object.keys(cal).sort()) {
    if (!cal[bay].calibrated) continue;
    const src = cal[bay].calibration_source || "?";
    (bySource[src] = bySource[src] || []).push(bay);
    total += 1;
  }
  const parts = Object.keys(bySource).sort().map(function (src) {
    return src + ": " + bySource[src].join(", ");
  });
  return total + (parts.length ? " (" + parts.join("; ") + ")" : "");
}

// Manual readings (POST /api/calibrate) still being offered to the estimator.
function offeredCalibrations(model) {
  const pending = (model || {}).manual_calibrations || {};
  const bays = Object.keys(pending).sort();
  if (!bays.length) return "none";
  return bays.map(function (bay) {
    return bay + " " + fmt(pending[bay].temp_c) + " C";
  }).join(", ");
}

// Model: /api/model (thermal identification, model store) plus the noise index
// already carried in /api/state's cmd.diagnostics.
function renderModel(model, diag) {
  const thermal = (model || {}).thermal || {};
  const store = (model || {}).store || {};
  const experiment = (model || {}).experiment || {};
  const noise = (diag || {}).noise || {};
  table("model", [
    row("Thermal model", fmt(thermal.status)),
    row("Prediction error", fmt(thermal.pred_err_c) + " C"),
    row("Model store", fmt(store.source)),
    row("Noise index", fmt(noise.db_index) + " dB"),
    row("Experiment running", fmt(experiment.running)),
    row("Calibrated bays", calibratedBays(model)),
    row("Manual readings", offeredCalibrations(model)),
  ]);
}

// Controllers: /api/state's "device_health" -- per controller what the adapter
// found (stuck outputs, absent aquabus slots, outputs not in PWM mode, the flow
// sensors, the active profile when one is published) and per channel the fan
// health: rpm and power against the fitted curve, and the 12 V rail -- with the
// rules that do not run for an output named as such rather than left blank
// (§8 item 117), and the software-sensor slots nothing feeds (§8 item 113).
function renderDevices(health) {
  const h = health || {};
  const rows = [];
  for (const d of (h.devices || [])) {
    const flags = [];
    for (const [key, label] of [["stuck_channels", "stuck"], ["absent_channels", "absent"],
                                ["not_pwm_channels", "not PWM"],
                                ["unconfigured_channels", "unconfigured"]]) {
      const list = d[key] || [];
      if (list.length) flags.push(label + " " + list.join(", "));
    }
    if (d.active_profile !== undefined && d.active_profile !== null) {
      flags.push("profile " + fmt(d.active_profile, 0));
    }
    const flows = Object.keys(d.flows || {}).filter(f => d.flows[f] !== null)
      .map(f => f + " " + fmt(d.flows[f], 0));
    if (flows.length) flags.push(flows.join(", "));
    const age = d.status_age_s === null || d.status_age_s === undefined
      ? "no status report" : "status " + fmt(d.status_age_s, 1) + " s ago";
    rows.push(row(d.label || d.device, age + (flags.length ? " | " + flags.join(" | ") : " | ok")));
  }
  const fans = h.fans || {};
  for (const ch of Object.keys(fans).sort()) {
    const f = fans[ch];
    const parts = [fmt(f.rpm, 0) + " rpm"];
    if (f.expected_rpm !== null && f.expected_rpm !== undefined) {
      parts.push("curve " + fmt(f.expected_rpm, 0));
    }
    // A rule that did not run for this output is named in "unmonitored" (§8 item 117),
    // whether the controller does not measure the field or the config does not say
    // what to expect. Say "not monitored" rather than print the number alone: neither
    // a blank nor a value must read as a rule that checked and passed.
    if (f.rpm_monitored === false) parts.push("rpm not monitored");
    // The spin-up kick (section 8 item 75): a channel commanded but not turning. The
    // failed fan's own line is in h.problems below; here it is the channel's state, and
    // a channel the rule does not watch says so rather than showing nothing.
    // `failed` is the declaration, not the state: it stands while a retry runs.
    const s = f.spin_up;
    if (s && s.failed) parts.push("FAN DOES NOT TURN" + (s.state === "failed" ? "" : ", retrying"));
    else if (s && (s.state === "kicking" || s.state === "confirming" || s.state === "verifying"))
      parts.push("spin-up " + s.state + " (" + s.attempts + ")");
    else if (s && s.monitored === false) parts.push("spin-up not monitored");
    parts.push(note(fmt(f.voltage_v) + " V", "rail", f.rail_monitored, f.voltage_v));
    parts.push(note(fmt(f.current_ma, 0) + " mA, " + fmt(f.power_w) + " W",
                    "power", f.power_monitored, f.power_w));
    rows.push(row(ch + ((f.problems || []).length ? " DRIFT" : ""), parts.join(", ")));
  }
  // Software sensors: not measurements, and nothing may bind one (§8 item 113). Show
  // the slots this daemon does not feed that are sitting on their configured fallback.
  for (const d of (h.devices || [])) {
    const unfed = (d.software_sensors || [])
      .filter(s => s.enabled && !s.written_by_daemon && s.reads_fallback)
      .map(s => s.name + " " + fmt(s.fallback_c) + " degC");
    if (unfed.length) {
      rows.push(row((d.label || d.device) + " software sensors",
                    "reading their configured fallback, nothing feeds them: " + unfed.join(", ")));
    }
  }
  for (const p of (h.problems || [])) rows.push(row("problem", p));
  if (!rows.length) rows.push(row("Controllers", "no device health yet"));
  table("devices", rows);
}

// The board itself: /api/state's "device_health.host" -- its temperature against
// the enclosure-air reference, whether the CPU was idle when that was judged, the
// decoded get_throttled word, the free space and read-only state of the card the
// daemon runs from, and the board's own problems. A health signal only: nothing
// here is a solver input (§8 item 103, "the disk nobody watches").
function hostHealthRows(health) {
  const h = (health || {}).host;
  if (!h) return [];
  const rows = [];
  // The disk nobody watches: disk_free_gb/disk_used_pct were always published
  // under "host" (below), but nothing judged them before item 103's shape was
  // extended to the card. read_only rides the kernel's own /proc/mounts report.
  if (h.disk_free_gb !== null && h.disk_free_gb !== undefined) {
    rows.push(row("Disk free", fmt(h.disk_free_gb) + " GB (" + fmt(h.disk_used_pct, 0) + " % used)"));
  }
  if (h.read_only !== null && h.read_only !== undefined) {
    rows.push(row("Filesystem", h.read_only ? "READ-ONLY" : "read-write"));
  }
  if (h.air_c !== null && h.air_c !== undefined) {
    const idle = h.idle === null || h.idle === undefined ? "?" : (h.idle ? "idle" : "busy");
    rows.push(row("Board vs air", fmt(h.divergence_c) + " C (air " + fmt(h.air_c) +
      " C, " + idle + ")"));
  }
  const t = h.throttled;
  if (t) {
    const names = ["under_voltage", "freq_capped", "throttled", "soft_temp_limit"];
    // A bit the source could not read is null, never false: it is shown as unknown,
    // and "unknown" names the conditions this source cannot see at all. The source
    // and the age of the word are shown too -- a vcgencmd word is polled on a cadence
    // and served from cache in between (§8 item 103).
    const now = names.filter(n => t[n + "_now"] === true);
    const ever = names.filter(n => t[n + "_since_boot"] === true);
    const where = [t.source || "unknown source"];
    if (t.hex) where.push(t.hex);
    if (t.age_s) where.push(fmt(t.age_s, 0) + " s ago");
    if ((t.unknown || []).length) where.push(t.unknown.join(", ") + " not read");
    rows.push(row("Throttling now",
      (now.length ? now.join(", ") : (t.now === false ? "no" : "unknown")) +
      " (" + where.join(", ") + ")"));
    rows.push(row("Since boot",
      ever.length ? ever.join(", ") : (t.since_boot === false ? "none" : "unknown")));
  } else {
    rows.push(row("Throttling now", "-"));
  }
  // Facts (hot, throttling) and the divergence hint are labelled apart: only the
  // facts are daemon problems, the hint says where to look, never what is wrong.
  for (const p of (h.faults || [])) rows.push(row("problem", p));
  for (const p of (h.hints || [])) rows.push(row("hint", p));
  return rows;
}

async function poll() {
  try {
    const [stateRes, healthRes] = await Promise.all([
      fetch("/api/state"), fetch("/api/health"),
    ]);
    const state = await stateRes.json();
    const health = await healthRes.json();

    document.getElementById("fault").className = health.solver === "fault" || health.solver === "fallback" ? "show" : "";

    const obs = state.obs || {};
    const cmd = state.cmd || {};
    const diag = cmd.diagnostics || {};

    // Some zones in fault: their fans (and coupled zones' fans) are on fallback policy.
    const degraded = document.getElementById("degraded");
    if (health.solver === "degraded") {
      const zones = diag.zones_in_fault || [];
      degraded.textContent = "DEGRADED: zone" + (zones.length === 1 ? " " : "s ") +
        (zones.length ? zones.join(", ") : "?") + " in fault";
      degraded.className = "show";
    } else {
      degraded.className = "";
    }

    table("overview", [
      row("Mode", fmt(state.mode)),
      row("Preset", fmt(state.preset)),
      row("Solver", fmt(health.solver)),
      row("Fault reason", fmt(health.fault_reason)),
      row("Uptime (s)", fmt(health.uptime_s, 0)),
      row("Version", fmt(health.version)),
    ]);

    const tempRows = (state.temps || []).map(t =>
      row(t + " (set " + fmt(state.setpoints[t]) + ")", fmt((obs.temps || {})[t]) + " C"));
    table("temps", tempRows);

    const fanRows = [];
    for (const ch of (state.channels || [])) {
      const override = ch in (state.overrides || {}) ? " (override)" : "";
      fanRows.push(row(ch + " PWM" + override, fmt((cmd.pwm || {})[ch])));
      fanRows.push(row(ch + " RPM", fmt((obs.rpm || {})[ch], 0)));
    }
    table("fans", fanRows);

    renderDevices(state.device_health);

    // DAS mode only: /api/state carries "bays" (the declarations in force)
    // exactly when the config has a topology (section 6); legacy configs
    // never have that key, so it doubles as the mode switch here.
    const isDas = "bays" in state;
    for (const id of ["drives", "zones", "model"]) {
      document.getElementById(id).hidden = !isDas;
    }
    if (isDas) {
      const [est, bayView, zoneView, model] = await Promise.all([
        getJson("/api/estimate"), getJson("/api/bays"), getJson("/api/zones"), getJson("/api/model"),
      ]);
      renderDrives(est, bayView);
      renderZones(zoneView);
      renderModel(model, diag);
    }

    table("mpc", [
      row("PWM min/max", fmt(state.pwm_min) + " / " + fmt(state.pwm_max)),
      row("Diagnostics", fmt(JSON.stringify(diag))),
    ]);

    const host = state.host || {};
    const hostRows = [
      row("CPU temp", fmt(host.cpu_temp_c) + " C"),
      row("Load (1m)", fmt(host.load1)),
      row("RAM used", fmt(host.mem_used_pct, 0) + " %"),
      row("Disk used", fmt(host.disk_used_pct, 0) + " %"),
      row("Wi-Fi RSSI", fmt(host.wifi_rssi_dbm, 0) + " dBm"),
      row("MQTT", fmt(health.mqtt_connected)),
      row("USB", fmt(health.usb_present)),
    ];
    table("host", hostRows.concat(hostHealthRows(state.device_health)));
  } catch (e) {
    document.getElementById("fault").className = "show";
    document.getElementById("fault").textContent = "FAULT (UI: " + e + ")";
  }
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
