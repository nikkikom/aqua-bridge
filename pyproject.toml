[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua-bridge"
version = "0.1.0"
description = "MPC fan controller for Aqua Computer aquaero 6 XT + Quadro on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
# Ranges must accept the Pi's apt packages (numpy 2.2.4, PyYAML 6.0.2) so that
# `pip install -e .` inside a --system-site-packages venv never builds numpy.
dependencies = [
  "numpy>=2.2,<3",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
http = ["aiohttp>=3.11,<4"]
mqtt = ["paho-mqtt>=2.1,<3"]
dev = [
  "pytest>=8.3,<9",
  "hypothesis>=6.130,<7",
  "ruff==0.16.7",  # keep in sync with .github/workflows/ci.yml
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aqua_bridge.publishers" = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--strict-markers"
markers = [
  "hardware: needs a live aquaero hidraw device (USB 0c70:f001 on the Pi); skipped elsewhere",
  "fuzzy: Hypothesis property tests; may be slow, still required in CI",
  "slow: long-running test (closed-loop sims, long fuzz runs)",
  "nightly: heavy sweeps and long simulations; excluded from PR/main CI, run by nightly-fuzz",
  "solver_cases(*cases): restrict the solver_kind parametrisation (pi, mpc, pi_das, mpc_das)",
  "pi: runs only on the Raspberry Pi (armv6l), e.g. the absolute step budget; skipped elsewhere",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["aqua_bridge"]
