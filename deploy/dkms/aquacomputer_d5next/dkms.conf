# DKMS package for the aquacomputer_d5next hwmon driver (PROJECT.md §9).
# deploy/install-aquacomputer-dkms.sh copies this file into
# /usr/src/aquacomputer_d5next-<version>/ and replaces @PKGVER@ with
# <upstream kernel version>-aqb<patch level>.
PACKAGE_NAME="aquacomputer_d5next"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="aquacomputer_d5next"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
