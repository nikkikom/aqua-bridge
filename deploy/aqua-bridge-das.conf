# systemd drop-in for a DAS install (deploy/install-pi.sh --das). Adds
# --source composite to the base unit's ExecStart= (aqua_bridge/__main__.py:
# --source composite builds the DAS composite source from the aquacomputer:
# and onewire: config sections, instead of the base unit's implicit --source
# xt6, the single controller of the xt6: section). PROJECT.md section 10.
#
# Installed as /etc/systemd/system/aqua-bridge.service.d/das.conf. systemd
# merges a [Service] drop-in into the base unit; an empty ExecStart= line
# clears the base unit's ExecStart= first (systemd.unit(5), "if you want to
# remove all prior assignments and start over, use an empty assignment"), so
# only the second ExecStart= line below is what actually runs. Everything
# else (Type=, NotifyAccess=, StateDirectory=, Restart=, WatchdogSec=,
# TimeoutStartSec=, SupplementaryGroups=) is inherited unchanged from
# aqua-bridge.service.
[Service]
ExecStart=
ExecStart=/opt/aqua-bridge/.venv/bin/python -m aqua_bridge --config /etc/aqua-bridge/config.yaml --source composite
